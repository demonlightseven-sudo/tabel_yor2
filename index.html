<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161B20" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Табель">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Табель</title>
<style>
:root{
  box-sizing:border-box;
  --bg:#F1EFEA; --surface:#FBFAF7; --ink:#1B2630; --muted:#5C6872; --line:#D8D4CA; --focus:#1B2630; --flash:#F6E7A8;
  --work:#1F7A45; --work-bg:#DCEBE1;
  --off:#3F6794;  --off-bg:#E0E8F0;
  --sick:#B3441C; --sick-bg:#F3DDD2;
  --pl:#6A4C9C;   --pl-bg:#E8E0F2;
  --ul:#7F6120;   --ul-bg:#F0E6CC;
  --ab:#A12641;   --ab-bg:#F4D9DF;
  --work-t:#1F7A45; --off-t:#3F6794; --sick-t:#B3441C; --pl-t:#6A4C9C; --ul-t:#7F6120; --ab-t:#A12641;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161B20; --surface:#1F262C; --ink:#E8E6E1; --muted:#9AA5AE; --line:#36404A; --focus:#E8E6E1; --flash:#5B5120;
    --work:#2E8653; --work-bg:#233A2C; --work-t:#86D6A3;
    --off:#4A74A3;  --off-bg:#222F3D;  --off-t:#9CBFE3;
    --sick:#C4552B; --sick-bg:#3E2B22; --sick-t:#F0A27E;
    --pl:#7E62B8;   --pl-bg:#2E2740;   --pl-t:#C3ADF0;
    --ul:#9A7A2C;   --ul-bg:#3A3220;   --ul-t:#E4C97F;
    --ab:#B53650;   --ab-bg:#40242B;   --ab-t:#F29AAE;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:0 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input[type=text],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:46px;padding:8px 12px;width:100%}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
[hidden]{display:none!important}

/* верхняя панель */
#top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line)}
.row1{display:flex;gap:8px;align-items:stretch}
.books{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.books button{border:0;border-radius:0;min-width:56px;font-weight:700;font-size:17px;background:transparent;color:var(--muted)}
.books button[aria-selected=true]{background:var(--ink);color:var(--bg)}
#dateBtn{flex:1;min-width:0;padding:0 6px;font-weight:600;font-size:clamp(13px,3.9vw,16px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dateBtn.past{background:#F3D98B;border-color:#C9A63A;color:#2A2100}
#menuBtn{width:48px;padding:0;font-size:22px}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 input{flex:1;min-width:0;font-size:18px}
#kb{width:54px;padding:0;font-weight:700}
#go{min-width:96px}

main{max-width:760px;margin:0 auto;padding:0 10px}
.msg{min-height:0;margin:10px 0 0;padding:0;font-size:15px;border-radius:8px}
.msg:not(:empty){padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-left-width:6px}
.msg.ok{border-left-color:var(--work)} .msg.bad{border-left-color:var(--sick)} .msg.warn{border-left-color:var(--ul)}
.msg .u{float:right;min-height:34px;margin:-4px -6px 0 8px;padding:0 10px;font-weight:700}
.syncbar{display:block;width:100%;margin:10px 0 0;min-height:38px;padding:6px 12px;text-align:left;font-size:13px;color:var(--muted);border-left:6px solid var(--line);border-radius:8px}
.syncbar.ok{border-left-color:var(--work)} .syncbar.warn{border-left-color:var(--ul);color:var(--ink)} .syncbar.bad{border-left-color:var(--sick);color:var(--ink);font-weight:600}
textarea.link{min-height:96px;font-size:13px;word-break:break-all}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:12px 0 8px}
.stats div{display:flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;border-left:6px solid var(--line)}
.stats b{font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums;min-width:24px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stats div{display:block;border-left-width:1px;border-top:4px solid var(--line)}.stats b{display:block}}
.stats span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stats .w{border-left-color:var(--work);border-top-color:var(--work)} .stats .o{border-left-color:var(--off);border-top-color:var(--off)} .stats .s{border-left-color:var(--sick);border-top-color:var(--sick)} .stats .a{border-left-color:var(--ab);border-top-color:var(--ab)} .stats .a b{color:var(--ab-t)}
.stats2{font-size:13px;color:var(--muted);margin:0 2px 8px}
.tabs{display:flex;gap:6px;margin:0 0 10px}
.tabs button{flex:1;font-weight:600;font-size:clamp(13px,3.9vw,16px);padding:0 6px;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* список */
#list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{padding:12px 12px 12px 12px;border-bottom:1px solid var(--line);border-left:7px solid var(--line);background:var(--surface);scroll-margin-top:130px}
.row:last-child{border-bottom:0}
.row.s-work{border-left-color:var(--work)} .row.s-off{border-left-color:var(--off)} .row.s-sick{border-left-color:var(--sick)}
.row.s-pl{border-left-color:var(--pl)} .row.s-ul{border-left-color:var(--ul)} .row.s-ab{border-left-color:var(--ab)}
.row.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--flash)}to{background:var(--surface)}}
.who b{font-size:17px;font-weight:650;word-break:break-word}
.who b .tn{display:inline;font-size:15px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;margin-right:7px}
.who span{display:block;font-size:13px;color:var(--muted)}
.plan{font-size:13px;color:var(--muted);margin-top:2px}
.plan.po{color:var(--off-t);font-weight:600}
.head{display:flex;gap:8px;align-items:flex-start}
.head .who{flex:1;min-width:0}
.head .more{flex:none;width:44px;min-height:44px;padding:0;font-size:22px;line-height:1;color:var(--muted);margin:-6px -6px 0 0}
.btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.btns button{min-height:52px;font-weight:700;font-size:clamp(13px,3.6vw,15.5px);padding:0 2px;min-width:0;white-space:nowrap}
.btns button[aria-pressed=true],.extra button[aria-pressed=true]{color:#fff}
button.work[aria-pressed=true]{background:var(--work);border-color:var(--work)}
button.off[aria-pressed=true]{background:var(--off);border-color:var(--off)}
button.sick[aria-pressed=true]{background:var(--sick);border-color:var(--sick)}
button.pl[aria-pressed=true]{background:var(--pl);border-color:var(--pl)}
button.ul[aria-pressed=true]{background:var(--ul);border-color:var(--ul)}
button.ab[aria-pressed=true]{background:var(--ab);border-color:var(--ab)}
.extra{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.extra button{min-height:46px;font-weight:600;font-size:14px;white-space:normal;line-height:1.15;padding:4px 6px}
.hours{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.hours .step{width:48px;padding:0;font-size:24px;font-weight:600}
.hours .val{min-width:70px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.hours .chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.hours .chips button{min-width:44px;padding:0 8px;font-variant-numeric:tabular-nums}
.hours .chips button[aria-pressed=true]{background:var(--work-bg);border-color:var(--work);color:var(--work-t);font-weight:700}
.empty{padding:26px 16px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.empty p{margin:0 0 12px}
.empty .primary{margin:4px}

/* окна */
#sheetWrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet{position:relative;width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh h2{margin:0;font-size:19px}
.sh button{width:44px;padding:0;font-size:20px}
.list2{display:flex;flex-direction:column;gap:8px}
.list2 button{text-align:left;min-height:52px;font-weight:600;padding:8px 14px}
.list2 button small{display:block;font-weight:400;color:var(--muted)}
.fld{margin:0 0 12px} .fld label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px} .acts button{flex:1;min-width:120px}
.note{font-size:14px;color:var(--muted)}
.prow{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .t{flex:1;min-width:0} .prow .t b{display:block;font-weight:600} .prow .t span{font-size:13px;color:var(--muted)}
.prow button{min-height:40px}
.prow.arch{opacity:.65}
textarea.rep{min-height:200px;font-size:14px;line-height:1.45;white-space:pre}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;padding:0;font-size:22px} .stepper .val{min-width:70px;text-align:center;font-size:20px;font-weight:700}
#toast{position:fixed;left:50%;transform:translate(-50%,8px);bottom:calc(74px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:40;max-width:calc(100% - 28px);text-align:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
#toast.on{opacity:1;transform:translate(-50%,0)}
.banner{background:var(--sick-bg);border-left:6px solid var(--sick);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
/* нижняя панель: День / Месяц */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#tabbar button{flex:1;border:0;border-radius:0;min-height:54px;background:transparent;font-weight:700;font-size:16px;color:var(--muted);border-top:3px solid transparent}
#tabbar button[aria-current=page]{color:var(--ink);border-top-color:var(--ink)}
body.kb #tabbar{display:none}
/* вкладка «Месяц» */
#month{display:none}
body.vmonth #month{display:block}
body.vmonth .row2,body.vmonth #dateBtn,body.vmonth #stats,body.vmonth #tabs,body.vmonth #list,body.vmonth #msg{display:none}
body.vmonth #menuBtn{margin-left:auto}
.mnav{display:flex;gap:6px;align-items:center;margin:10px 0 6px}
.mnav button{width:46px;padding:0;font-size:18px;flex:none}
.mnav .mlabel{flex:1;text-align:center;font-size:18px;font-weight:700;min-width:0}
.mleg{font-size:12px;color:var(--muted);margin:0 2px 8px;line-height:1.35}
.mwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
table.mt{border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
.mt th,.mt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;min-width:36px;height:38px;padding:0;background:var(--surface)}
.mt thead th{position:sticky;top:0;z-index:2}
.mt th.c0{position:sticky;left:0;z-index:1;text-align:left;min-width:150px;max-width:150px;width:150px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mt th.c0 .tn{color:var(--muted);font-weight:600;margin-right:6px}
.mt thead th.c0{z-index:3}
.mt .tot{min-width:44px;font-weight:700;background:var(--bg)}
.mt .dh{border:0;background:none;border-radius:0;min-height:38px;width:100%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-weight:700;font-size:13px}
.mt .dh small{font-weight:400;color:var(--muted);font-size:10px}
.mt th.tdy .dh{box-shadow:inset 0 -3px 0 var(--ink)}
.mt td{cursor:pointer;font-weight:700}
.mt td.w{background:var(--work-bg);color:var(--work-t)} .mt td.o{background:var(--off-bg);color:var(--off-t)} .mt td.s{background:var(--sick-bg);color:var(--sick-t)}
.mt td.p{background:var(--pl-bg);color:var(--pl-t)} .mt td.u{background:var(--ul-bg);color:var(--ul-t)} .mt td.a{background:var(--ab-bg);color:var(--ab-t)}
.mt td.po{background-image:repeating-linear-gradient(135deg,transparent 0 4px,var(--line) 4px 5px)}
.mt tfoot th,.mt tfoot td{position:sticky;background:var(--bg);font-weight:700;color:var(--muted);cursor:default}
.mt tfoot tr.f1 th,.mt tfoot tr.f1 td{bottom:38px;z-index:1}
.mt tfoot tr.f2 th,.mt tfoot tr.f2 td{bottom:0;z-index:1}
.mt tfoot tr.f1 th.c0,.mt tfoot tr.f2 th.c0{z-index:3}
.danger{color:var(--sick-t);border-color:var(--sick)}
.moldhint{font-size:13px;margin:0 0 8px;padding:8px 10px;border-left:6px solid var(--ul);background:var(--surface);border-radius:6px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.row.flash{animation:none}button:active{transform:none}}
</style>
</head>
<body>
<header id="top">
  <div class="row1">
    <div class="books" role="tablist" aria-label="Табель">
      <button role="tab" data-a="book" data-b="rf">РФ</button>
      <button role="tab" data-a="book" data-b="are">АРЕ</button>
    </div>
    <button id="dateBtn" data-a="date" aria-label="Выбрать день"></button>
    <button id="menuBtn" data-a="menu" aria-label="Меню">☰</button>
  </div>
  <div class="row2">
    <input id="q" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Табельный номер">
    <button id="kb" data-a="kb" aria-label="Переключить клавиатуру: цифры или буквы">abc</button>
    <button id="go" class="primary" data-a="go">Отметить</button>
  </div>
</header>
<main>
  <div id="banner"></div>
  <button id="syncbar" class="syncbar" data-a="syncsheet" hidden></button>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <div id="stats"></div>
  <div class="tabs" id="tabs"></div>
  <ul id="list"></ul>
  <div id="month"></div>
</main>
<nav id="tabbar" aria-label="Разделы"><button data-a="view" data-v="day">День</button><button data-a="view" data-v="month">Месяц</button></nav>
<div id="sheetWrap" hidden><div class="backdrop" data-a="close"></div><div id="sheet" role="dialog" aria-modal="true" aria-label="Окно"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';

var KEY='tabel-app-v1';
var APP_VER='11';   /* версия приложения: та же цифра лежит в version.txt на сайте */
var SEED=null;   /* __SEED__ */

/* ------------------------------------------------------------- справочники */
var BOOKS={rf:'РФ',are:'АРЕ'};
var STAT=[['work','Пришёл'],['off','Выходной'],['sick','Больничный'],['pl','Отпуск'],['ul','Отпуск без ЗП'],['ab','Прогул']];
var LBL={}; STAT.forEach(function(x){ LBL[x[0]]=x[1]; });
var CELL={off:'В',sick:'Б',pl:'ОТ',ul:'БС',ab:'ПР'};
var SCHEDS=[
  {id:'',name:'График не задан',short:''},
  {id:'std',name:'Обычный: вс–чт рабочие, выходные пт и сб',short:'Обычный график'},
  {id:'w61',name:'6/1 · выходной только пятница',short:'График 6/1'},
  {id:'g1',name:'№1 · 24/6, выходные 1–6 числа',short:'График №1',from:1,to:6},
  {id:'g2',name:'№2 · 24/6, выходные 7–12 числа',short:'График №2',from:7,to:12},
  {id:'g3',name:'№3 · 24/6, выходные 13–18 числа',short:'График №3',from:13,to:18},
  {id:'g4',name:'№4 · 24/6, выходные 19–24 числа',short:'График №4',from:19,to:24},
  {id:'g5',name:'№5 · 24/6, выходные 25–30 числа',short:'График №5',from:25,to:30}
];
var MONTHS_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONTHS_N=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var WD=['вс','пн','вт','ср','чт','пт','сб'];
var WD_FULL=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
var ST_OK={work:1,off:1,sick:1,pl:1,ul:1,ab:1};

/* ------------------------------------------------------------- мелочи */
function $(id){ return document.getElementById(id); }
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseYmd(s){ var a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function addDays(s,n){ var d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function today(){ return ymd(new Date()); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtH(h){ return String(h).replace('.',','); }
function clampH(h){ h=Number(h); return isFinite(h)?Math.min(24,Math.max(0,Math.round(h*2)/2)):8; }
function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function daysIn(m){ var a=m.split('-').map(Number); return new Date(a[0],a[1],0).getDate(); }
function schedById(id){ return SCHEDS.filter(function(x){ return x.id===id; })[0]; }
function validSched(v){ return schedById(v)?v:''; }
function normNum(n){ n=String(n).trim().replace(/^0+/,''); return n||'0'; }
var AR={}; for(var i=0;i<10;i++){ AR[String.fromCharCode(0x0660+i)]=String(i); AR[String.fromCharCode(0x06F0+i)]=String(i); }
function latinDigits(s){ return String(s).replace(/[\u0660-\u0669\u06F0-\u06F9]/g,function(c){ return AR[c]; }); }

function planOff(p,ds){
  if(!p.sched) return null;
  var d=parseYmd(ds);
  if(p.sched==='std'){ var w=d.getDay(); return w===5||w===6; }
  if(p.sched==='w61') return d.getDay()===5;
  var g=schedById(p.sched); if(!g||!g.from) return null;
  var n=d.getDate(); return n>=g.from&&n<=g.to;
}

function dayObj(d,create){
  var r=bk().records;
  if(!r[d]&&create) r[d]={};
  return r[d]||{};
}
function dropEmpty(d){ var r=bk().records; if(r[d]&&!Object.keys(r[d]).length) delete r[d]; }
function setStatus(id,s){
  var day=dayObj(ui.date,true), cur=day[id];
  if(cur&&cur.s===s) delete day[id];
  else day[id]={s:s,h:s==='work'?(cur&&cur.s==='work'?cur.h:bk().defH):0,t:Date.now()};
  dropEmpty(ui.date); save(); track(root.cur,ui.date,id); updateRow(id);
}
function setHours(id,h){
  var day=dayObj(ui.date,false), r=day[id]; if(!r||r.s!=='work') return;
  r.h=clampH(h); r.t=Date.now(); save(); track(root.cur,ui.date,id); updateRow(id);
}
function fillBySchedule(){
  var day=dayObj(ui.date,true), nw=0, no=0, now=Date.now(), made=[];
  activePeople().forEach(function(p){
    if(day[p.id]) return;
    if(planOff(p,ui.date)===true){ day[p.id]={s:'off',h:0,t:now}; no++; } else { day[p.id]={s:'work',h:bk().defH,t:now}; nw++; }
    made.push(p.id);
  });
  dropEmpty(ui.date); save(); made.forEach(function(id){ track(root.cur,ui.date,id); }); render();
  toast('Пришли: '+nw+(no?', выходной по графику: '+no:''));
}

function submitEntry(){
  var q=$('q'), text=latinDigits(q.value).trim();
  if(!text){ q.focus(); return; }
  var toks=text.split(/[\s,;]+/).filter(Boolean).map(function(x){ return x.replace(/^[№#]/,''); });
  var allNum=toks.length&&toks.every(function(x){ return /^\d+$/.test(x); });
  var ppl=activePeople();
  if(!allNum){
    var found=ppl.filter(function(p){ return matches(p,text); });
    if(found.length===1){ markPresent([found[0]],[],text); return; }
    showMsg(found.length?'Найдено: '+found.length+'. Нажмите «Пришёл» у нужного человека в списке или введите табельный номер.':'Никого не найдено.',found.length?'warn':'bad');
    return;
  }
  var by={}; ppl.forEach(function(p){ if(p.num) (by[normNum(p.num)]=by[normNum(p.num)]||[]).push(p); });
  var seen={}, hit=[], unknown=[], dup=[];
  toks.forEach(function(t){
    var k=normNum(t); if(seen[k]) return; seen[k]=1;
    var m=by[k];
    if(!m) unknown.push(t); else if(m.length>1) dup.push(t); else hit.push(m[0]);
  });
  markPresent(hit,unknown,text,dup);
}
function markPresent(hit,unknown,text,dup){
  var day=dayObj(ui.date,true), changes=[], done=[], same=[], conflict=[];
  hit.forEach(function(p){
    var cur=day[p.id];
    if(cur&&cur.s==='work'){ same.push(p); return; }
    if(cur){ conflict.push([p,cur]); return; }
    day[p.id]={s:'work',h:bk().defH,t:Date.now()}; changes.push([p.id,null]); done.push(p);
  });
  dropEmpty(ui.date); save(); done.forEach(function(p){ track(root.cur,ui.date,p.id); });
  var lines=[], one=hit.length===1&&!unknown.length&&!(dup&&dup.length);
  if(one&&done.length){ lines.push('✅ <b>'+esc(done[0].num)+' '+esc(done[0].name)+'</b> — пришёл, '+fmtH(bk().defH)+' ч'); }
  else if(done.length){ lines.push('✅ Отмечено: <b>'+done.length+'</b>'); }
  same.forEach(function(p){ lines.push('• '+esc(p.num)+' '+esc(p.name)+' — уже отмечен как «Пришёл»'); });
  conflict.forEach(function(c){ lines.push('⚠ '+esc(c[0].num)+' '+esc(c[0].name)+' — уже отмечен: '+LBL[c[1].s]+'. Не менял, исправьте в списке.'); });
  (dup||[]).forEach(function(t){ lines.push('⚠ Номер '+esc(t)+' у нескольких человек. Отметьте в списке.'); });
  if(unknown.length===1) lines.push('❌ '+esc(unknown[0])+' — работника с таким табельным номером нет в списке.');
  else if(unknown.length) lines.push('❌ Работника с таким табельным номером нет в списке: '+esc(unknown.slice(0,20).join(', '))+(unknown.length>20?' и ещё '+(unknown.length-20):''));
  var kind=unknown.length||conflict.length||(dup&&dup.length)?(done.length?'warn':'bad'):'ok';
  if(!done.length&&!unknown.length&&!conflict.length&&!(dup&&dup.length)) kind='ok';
  showMsg(lines.join('<br>'),kind,changes.length?{date:ui.date,book:root.cur,changes:changes}:null);
  if(done.length||same.length||conflict.length){ $('q').value=''; ui.q=''; }
  render();
  if(one){ var li=document.querySelector('#list li[data-id="'+(window.CSS&&CSS.escape?CSS.escape(hit[0].id):hit[0].id)+'"]'); if(li){ li.scrollIntoView({block:'center'}); li.classList.add('flash'); } }
  $('q').focus({preventScroll:true});
}
function undo(){
  var u=ui.undo; if(!u) return;
  var b=root.books[u.book], day=b.records[u.date]||(b.records[u.date]={});
  u.changes.forEach(function(c){ if(c[1]===null) delete day[c[0]]; else day[c[0]]={s:c[1].s,h:c[1].h,t:Date.now()}; });
  if(!Object.keys(day).length) delete b.records[u.date];
  save(); u.changes.forEach(function(c){ track(u.book,u.date,c[0]); }); clearMsg(); render(); toast('Отменено');
}

function label(p){ return p.name+(p.num?' (таб. № '+p.num+')':''); }
function reportText(){

  });

  var L=['Табель '+BOOKS[root.cur]+' за '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+(bk().object?', объект: '+bk().object:'')];

  [['Выходной',o],['Больничный',s],['Отпуск',pl],['Отпуск без сохранения ЗП',ul],['Прогул',ab],['Без отметки',u]].forEach(function(g){
    if(g[1].length){ L.push(g[0]+': '+g[1].length+' чел.'); g[1].forEach(function(x){ L.push('• '+x); }); }
  });
  return L.join('\n');
}
function cellText(r){ return !r?'':r.s==='work'?fmtH(r.h):CELL[r.s]; }
function monthCsv(month){
  var n=daysIn(month), rows=[], head=['Таб. №','ФИО','Должность'];
  for(var i=1;i<=n;i++) head.push(String(i));
  head.push('Дней','Часов'); rows.push(head);
  var recs=bk().records, cnt=[]; for(var k=0;k<n;k++) cnt.push(0);
  bk().people.filter(function(p){
    if(!p.archived) return true;
    return Object.keys(recs).some(function(d){ return d.indexOf(month+'-')===0&&recs[d][p.id]; });
  }).forEach(function(p){
    var row=[p.num||'',p.name,p.role||''], days=0, hrs=0;
    for(var i=1;i<=n;i++){
      var r=(recs[month+'-'+pad(i)]||{})[p.id];
      row.push(cellText(r));
      if(r&&r.s==='work'&&r.h>0){ days++; hrs+=r.h; cnt[i-1]++; }
    }
    row.push(days,fmtH(hrs)); rows.push(row);
  });
  var foot=['','Вышло, чел.','']; cnt.forEach(function(c){ foot.push(c||''); }); foot.push('',''); rows.push(foot);
  function q(v,g){ v=String(v); if(g&&/^[=+\-@]/.test(v)) v="'"+v; return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
  return '\uFEFF'+rows.map(function(r){ return r.map(function(v,i){ return q(v,i<3); }).join(';'); }).join('\r\n');
}
function shareText(text){
  if(navigator.share){
    return navigator.share({text:text}).then(function(){ return 'shared'; },function(e){ return e&&e.name==='AbortError'?'cancel':copy(text); });
  }
  return Promise.resolve(copy(text));
}
function copy(text){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(function(){ return 'copied'; },function(){ return legacyCopy(text); });
  }catch(e){}
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(t){
  try{ var a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); var ok=document.execCommand('copy'); a.remove(); return ok?'copied':'fail'; }catch(e){ return 'fail'; }
}
function viaClaude(name,content){
  try{
    if(window.claude&&window.claude.use){
      return window.claude.use('downloads').then(function(c){
        if(!c) return null;
        return c.save({filename:name,data:content}).then(function(){ return 'download'; },function(e){ return e&&e.code==='declined'?'cancel':null; });
      },function(){ return null; });
    }
  }catch(e){}
  return Promise.resolve(null);
}
function saveFile(name,mime,content){
  return viaClaude(name,content).then(function(r){ return r||saveFile2(name,mime,content); });
}
function saveFile2(name,mime,content){
  var file; try{ file=new File([content],name,{type:mime}); }catch(e){ file=null; }
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    return navigator.share({files:[file],title:name}).then(function(){ return 'shared'; },function(e){ return e&&e.name==='AbortError'?'cancel':download(name,mime,content); });
  }
  return Promise.resolve(download(name,mime,content));
}
function download(name,mime,content){
  try{
    var url=URL.createObjectURL(new Blob([content],{type:mime}));
    var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },3000);
    return 'download';
  }catch(e){ return 'fail'; }
}
function reportDone(r){ toast(r==='copied'?'Скопировано':r==='download'?'Файл сохранён':r==='shared'?'Готово':r==='cancel'?'':'Не получилось'); }

function deletePeopleIn(bookId,ids){
  var b=root.books[bookId], set={}, marks=0; ids.forEach(function(i){ set[i]=1; });
  var gone={}; b.people.forEach(function(p){ if(set[p.id]&&p.num) gone[p.num]=1; });
  b.people=b.people.filter(function(p){ return !set[p.id]; });
  b.people.forEach(function(p){ if(p.num) delete gone[p.num]; });          // номер ещё есть у другого человека
  Object.keys(b.records).forEach(function(d){
    var day=b.records[d];
    Object.keys(day).forEach(function(id){ if(set[id]){ delete day[id]; marks++; } });
    if(!Object.keys(day).length) delete b.records[d];
  });
  Object.keys(sync.queue).forEach(function(k){ var it=sync.queue[k]; if(it.b===bookId&&gone[it.n]) delete sync.queue[k]; });   // неотправленные отметки удалённых не нужны

  if(!window.crypto||!crypto.subtle) return Promise.reject(new Error('nocrypto'));
  if(!pack||pack.v!==1||pack.kdf!=='PBKDF2-SHA256'||!(pack.iter>=100000&&pack.iter<=2000000)) return Promise.reject(new Error('format'));
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pass.normalize('NFC')),'PBKDF2',false,['deriveKey'])
    .then(function(k){ return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(pack.salt),iterations:pack.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']); })
    .then(function(key){ return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(pack.iv)},key,b64d(pack.data)); })
    .then(function(buf){ return new TextDecoder().decode(buf); });
}
function sheetPassword(){
  openSheet('Список с сайта','<p class="note">Список людей лежит на сайте в зашифрованном виде. Введите пароль, который вам дал администратор.</p>'+
    '<div class="fld"><label for="pw">Пароль</label><input type="password" id="pw" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>'+
    '<div class="acts" style="margin-top:0"><button class="primary" data-a="pwgo">Расшифровать и загрузить</button><button data-a="close">Отмена</button></div>'+
    '<p class="note" id="pwmsg" role="status" aria-live="polite"></p>');
  setTimeout(function(){ var e=$('pw'); if(e) e.focus(); },80);
}
function loadEncrypted(){
  var pass=$('pw').value, msg=$('pwmsg');
  if(!pass){ msg.textContent='Введите пароль.'; return; }
  msg.textContent='Проверяю…';
  fetch('people.enc',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('nofile'); return r.json(); })
    .then(function(pack){ return decryptPack(pack,pass); })
    .then(function(text){ previewImport(JSON.parse(text)); })
    .catch(function(e){
      var m=e&&e.message;
      msg.textContent=m==='nofile'?'На сайте нет файла people.enc. Его должен загрузить администратор рядом с index.html.':
        m==='nocrypto'?'Нужен защищённый адрес сайта (https://).':
        e&&e.name==='OperationError'?'Неверный пароль.':
        e&&e.name==='TypeError'&&m!=='format'?'Нет связи с сайтом. Проверьте интернет.':'Не удалось прочитать список.';
    });
}
function doImport(mode){
  var src=pendingImport; pendingImport=null; if(!src) return;
  if(mode==='all'){ root.books.rf=src.books.rf; root.books.are=src.books.are; }
  else{
    ['rf','are'].forEach(function(b){
      var dst=root.books[b];
      src.books[b].people.forEach(function(p){
        var ex=p.num?dst.people.filter(function(x){ return x.num===p.num; })[0]:dst.people.filter(function(x){ return !x.num&&x.name===p.name; })[0];
        if(ex){ ex.name=p.name; ex.role=p.role; ex.sched=p.sched; ex.archived=p.archived; }
        else dst.people.push(p);
      });
      dst.object=src.books[b].object||dst.object; dst.defH=src.books[b].defH;
    });
  }
  sync.rev={}; saveSync();
  save(); closeSheet(); render(); toast('Готово');
}

    case 'undo': undo(); break;
    case 'flt': ui.filter=el.dataset.f; renderStats(); renderList(); break;
    case 'set': setStatus(id,el.dataset.s); break;
    case 'hstep': { var r=dayRec(ui.date)[id]; if(r) setHours(id,r.h+Number(el.dataset.d)); break; }
    case 'hset': setHours(id,Number(el.dataset.v)); break;
    case 'more': ui.open[id]=!ui.open[id]; updateRow(id); break;
    case 'fill': {
      var s=stats();

      openSheet('Отметить по графику','<p>Отметить <b>'+s.unm+'</b> чел. без отметки в табеле '+BOOKS[root.cur]+' за выбранный день?</p><p class="note">Рабочий день по графику: «Пришёл» ('+fmtH(bk().defH)+' ч). Выходной по графику: «Выходной». Кто без графика: «Пришёл».</p>'+
        '<div class="acts"><button class="primary" data-a="fillok">Да, отметить</button><button data-a="close">Отмена</button></div>');
      break;
    }
    case 'fillok': closeSheet(); fillBySchedule(); break;
    case 'report': sheetReport(); break;
    case 'rshare': shareText($('rep').value).then(reportDone); break;
    case 'rcopy': copy($('rep').value).then(reportDone); break;
    case 'month': sheetMonth(); break;
    case 'mshift': sheetMonth(el.dataset.m); break;
    case 'mexport': saveFile('tabel-'+root.cur+'-'+el.dataset.m+'.csv','text/csv;charset=utf-8',monthCsv(el.dataset.m)).then(reportDone); break;
    case 'settings': sheetSettings(); break;
    case 'syncsheet': sheetSync(); break;
    case 'ssave': saveSyncForm(); break;
    case 'snow': syncNow(); toast('Синхронизирую…'); break;
    case 'smonth': { var cnt=queueMonth(); toast(cnt?'Отметок поставлено в очередь: '+cnt:'За этот месяц отметок нет'); break; }
    case 'spl': {
      var np=bk().people.filter(function(p){ return p.num&&!p.archived; }).length;
      openSheet('Список людей в таблицу','<p>В таблицу будет отправлено людей: <b>'+np+'</b> (табель '+BOOKS[root.cur]+'): табельный номер, ФИО, должность, график.</p><p class="note">Фамилии попадут в лист «Люди» вашей Google Таблицы. Телефонам они не отдаются. Продолжайте, только если таблица закрыта от посторонних.</p>'+
        '<div class="acts"><button class="primary" data-a="splok">Да, отправить</button><button data-a="syncsheet">Отмена</button></div><p class="note" id="plmsg"></p>');
      break;
    }
    case 'splok': {
      var plist=bk().people.filter(function(p){ return p.num&&!p.archived; }).map(function(p){ return {n:p.num,name:p.name,role:p.role,sched:p.sched,a:p.added||0}; });
      $('plmsg').textContent='Отправляю…';
      call({action:'people',book:root.cur,people:plist}).then(function(j){ $('plmsg').textContent='Готово: отправлено людей '+j.n+'.'; }).catch(function(e){ if($('plmsg')) $('plmsg').textContent=syncMsgFor(e); });
      break;
    }
    case 'slink': {

      openSheet('Ссылка для подключения','<p class="note">Откройте эту ссылку на другом телефоне, и таблица подключится сама (останется ввести своё имя). В ссылке секретный код: отправляйте её только ответственным, в личном сообщении.</p>'+
        '<textarea class="link" id="lnk" readonly aria-label="Ссылка">'+esc(link)+'</textarea><div class="acts"><button class="primary" data-a="lshare">Отправить</button><button data-a="lcopy">Скопировать</button><button data-a="syncsheet">Назад</button></div>');
      break;
    }
    case 'lshare': shareText($('lnk').value).then(reportDone); break;
    case 'lcopy': copy($('lnk').value).then(reportDone); break;
    case 'soff':
      openSheet('Отключить таблицу','<p>Телефон перестанет отправлять отметки в таблицу и получать их.'+(qn()?' <b>Не отправлено отметок: '+qn()+'.</b> В таблицу они не попадут.':'')+' Отметки на телефоне останутся.</p><div class="acts"><button class="primary" data-a="soffok">Отключить</button><button data-a="syncsheet">Отмена</button></div>');
      break;
    case 'soffok': sync={url:'',code:'',who:sync.who,queue:{},lastOk:0,rev:{},pq:[],aq:[]}; saveSync(); syncErr=''; closeSheet(); render(); toast('Таблица отключена'); break;
    case 'defh': bk().defH=Math.min(24,Math.max(0.5,bk().defH+Number(el.dataset.d))); save(); $('defv').textContent=fmtH(bk().defH)+' ч'; break;
    case 'backup': sheetBackup(); break;
    case 'bsave': saveFile('tabel-kopiya-'+today()+'.json','application/json',JSON.stringify(root,null,1)).then(reportDone); break;
    case 'pwsheet': sheetPassword(); break;
    case 'pwgo': loadEncrypted(); break;
    case 'import': closeSheet(); $('file').value=''; $('file').click(); break;
    case 'imp': doImport(el.dataset.m); break;
    case 'install': sheetInstall(); break;
    case 'doinstall': if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt=null; closeSheet(); } break;
    case 'people': sheetPeople(); break;
    case 'padd': sheetPerson(null); break;
    case 'pbulk': sheetBulk(); break;
    case 'pbulkok': addBulk(); break;
    case 'pdel': if(editId) sheetDelete([editId]); break;
    case 'pdelarch': sheetDelete(bk().people.filter(function(x){ return x.archived; }).map(function(x){ return x.id; })); break;
    case 'pdelall': deleteEverywhere(); break;
    case 'pdelok': {
      var dn=delIds.length, dm=deletePeople(delIds); delIds=[]; editId=null; render(); sheetPeople();
      toast('Удалено навсегда: '+dn+' чел., отметок: '+dm); break;
    }
    case 'pedit': sheetPerson(id); break;
    case 'psave': savePerson(); break;
    case 'parch': { var p=person(editId); if(p){ p.archived=!p.archived; save(); render(); sheetPeople(); } break; }
  }
});

/* самообновление: телефон сам переходит на новую версию с сайта, даже если приложение не закрывали */
var updChecking=false;
function checkUpdate(){
  if(updChecking||!/^https?:$/.test(location.protocol)||navigator.onLine===false) return;
  updChecking=true;
  fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.text():''; }).then(function(v){
    updChecking=false; v=String(v||'').trim();
    if(!/^\d+$/.test(v)||Number(v)<=Number(APP_VER)) return;
    if(!$('sheetWrap').hidden||flushing||document.activeElement===$('q')){ setTimeout(checkUpdate,30000); return; }
    try{ if(sessionStorage.getItem('tabel-upd-tried')===v) return; sessionStorage.setItem('tabel-upd-tried',v); sessionStorage.setItem('tabel-upd',v); }catch(e){ return; }   // не больше одной попытки на версию: без зацикливания
    location.reload();
  }).catch(function(){ updChecking=false; });
}
try{ if(sessionStorage.getItem('tabel-upd')){ sessionStorage.removeItem('tabel-upd'); setTimeout(function(){ toast('Приложение обновлено до версии '+APP_VER); },600); } }catch(e){}
setTimeout(checkUpdate,3000);
/* основной адрес таблицы (веб-приложения Apps Script) лежит на сайте в api.json.
   Если он сменился, телефон проверяет новый адрес своим секретным кодом и переходит на него сам. */
var apiChecking=false, apiLast=0;
function checkApi(force){
  if(apiChecking||!sync.code||!/^https?:$/.test(location.protocol)||navigator.onLine===false) return;
  if(!force&&Date.now()-apiLast<60000) return;
  apiChecking=true; apiLast=Date.now();
  fetch('api.json?t='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.json():null; }).then(function(o){
    var u=o&&typeof o.url==='string'?o.url.trim():'';
    if(!okUrl(u)||u===sync.url){ apiChecking=false; return; }
    return fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({code:sync.code,action:'ping',who:sync.who,app:APP_VER}),redirect:'follow',cache:'no-store'})
      .then(function(r){ return r.json(); }).then(function(j){
        apiChecking=false;
        if(!j||j.ok!==true) return;
        sync.url=u; sync.rev={}; saveSync(); syncErr=''; renderSyncBar();
        toast('Адрес таблицы обновлён автоматически'); syncNow();
      });
  }).catch(function(){ apiChecking=false; });
}
setTimeout(function(){ checkApi(true); },2000);
setInterval(function(){ if(!document.hidden) checkApi(); },5*60000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) checkApi(); });
setInterval(function(){ if(!document.hidden) checkUpdate(); },5*60000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) checkUpdate(); });
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
