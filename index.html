<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161B20" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Табель">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Табель</title>
<style>
:root{
  box-sizing:border-box;
  --bg:#F1EFEA; --surface:#FBFAF7; --ink:#1B2630; --muted:#5C6872; --line:#D8D4CA; --focus:#1B2630; --flash:#F6E7A8;
  --work:#1F7A45; --work-bg:#DCEBE1;
  --off:#3F6794;  --off-bg:#E0E8F0;
  --sick:#B3441C; --sick-bg:#F3DDD2;
  --pl:#6A4C9C;   --pl-bg:#E8E0F2;
  --ul:#7F6120;   --ul-bg:#F0E6CC;
  --ab:#A12641;   --ab-bg:#F4D9DF;
  --work-t:#1F7A45; --off-t:#3F6794; --sick-t:#B3441C; --pl-t:#6A4C9C; --ul-t:#7F6120; --ab-t:#A12641;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161B20; --surface:#1F262C; --ink:#E8E6E1; --muted:#9AA5AE; --line:#36404A; --focus:#E8E6E1; --flash:#5B5120;
    --work:#2E8653; --work-bg:#233A2C; --work-t:#86D6A3;
    --off:#4A74A3;  --off-bg:#222F3D;  --off-t:#9CBFE3;
    --sick:#C4552B; --sick-bg:#3E2B22; --sick-t:#F0A27E;
    --pl:#7E62B8;   --pl-bg:#2E2740;   --pl-t:#C3ADF0;
    --ul:#9A7A2C;   --ul-bg:#3A3220;   --ul-t:#E4C97F;
    --ab:#B53650;   --ab-bg:#40242B;   --ab-t:#F29AAE;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:0 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input[type=text],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:46px;padding:8px 12px;width:100%}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
[hidden]{display:none!important}

/* верхняя панель */
#top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line)}
.row1{display:flex;gap:8px;align-items:stretch}
.books{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.books button{border:0;border-radius:0;min-width:56px;font-weight:700;font-size:17px;background:transparent;color:var(--muted)}
.books button[aria-selected=true]{background:var(--ink);color:var(--bg)}
#dateBtn{flex:1;min-width:0;padding:0 6px;font-weight:600;font-size:clamp(13px,3.9vw,16px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dateBtn.past{background:#F3D98B;border-color:#C9A63A;color:#2A2100}
#menuBtn{width:48px;padding:0;font-size:22px}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 input{flex:1;min-width:0;font-size:18px}
#kb{width:54px;padding:0;font-weight:700}
#go{min-width:96px}
#scanBtn{width:54px;padding:0;font-size:22px}
/* сканер карточек */
body.scanning{overflow:hidden}
#scan{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#scan .schead{padding:10px 14px;display:flex;flex-direction:column;gap:2px}
#scan .schead span{font-size:13px;opacity:.8}
#scan .scview{position:relative;flex:1;min-height:0;overflow:hidden}
#scan video{width:100%;height:100%;object-fit:cover;display:block}
#scan .scframe{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#scan .scframe i{display:block;width:78%;height:20%;max-height:140px;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
#scan .scmsg{margin:0;padding:12px 14px;font-size:17px;font-weight:600;min-height:52px;background:#111}
#scan .scmsg.ok{background:#1b5e20}
#scan .scmsg.bad{background:#8e2a1c}
#scan .scacts{display:flex;gap:10px;padding:10px 14px 14px;background:#111}
#scan .scacts button{flex:1;min-height:52px;font-size:17px;font-weight:700}
#scan #scTorch.on{background:#ffd54f;color:#000}

main{max-width:760px;margin:0 auto;padding:0 10px}
.msg{min-height:0;margin:10px 0 0;padding:0;font-size:15px;border-radius:8px}
.msg:not(:empty){padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-left-width:6px}
.msg.ok{border-left-color:var(--work)} .msg.bad{border-left-color:var(--sick)} .msg.warn{border-left-color:var(--ul)}
.msg .u{float:right;min-height:34px;margin:-4px -6px 0 8px;padding:0 10px;font-weight:700}
.syncbar{display:block;width:100%;margin:10px 0 0;min-height:38px;padding:6px 12px;text-align:left;font-size:13px;color:var(--muted);border-left:6px solid var(--line);border-radius:8px}
.syncbar.ok{border-left-color:var(--work)} .syncbar.warn{border-left-color:var(--ul);color:var(--ink)} .syncbar.bad{border-left-color:var(--sick);color:var(--ink);font-weight:600}
textarea.link{min-height:96px;font-size:13px;word-break:break-all}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:12px 0 8px}
.stats>button{font:inherit;color:inherit;text-align:left;width:100%;min-width:0;min-height:0;cursor:pointer;display:flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;border-left:6px solid var(--line)}
.stats b{font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums;min-width:24px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stats>button{display:block;border-left-width:1px;border-top:4px solid var(--line)}.stats b{display:block}}
.stats span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stats .w{border-left-color:var(--work);border-top-color:var(--work)} .stats .o{border-left-color:var(--off);border-top-color:var(--off)} .stats .s{border-left-color:var(--sick);border-top-color:var(--sick)} .stats .a{border-left-color:var(--ab);border-top-color:var(--ab)} .stats .a b{color:var(--ab-t)}
.stats>button.on{outline:3px solid var(--ink);outline-offset:-2px;background:var(--bg)}
.fltbrig{min-height:44px;max-width:100%;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px}.fltbrig.on{outline:2px solid var(--ink)}.fltx{color:var(--ab-t)}
#list li.fltinfo{list-style:none;padding:6px 4px;font-size:13px;color:var(--muted);border:0;background:none}#list li.fltact{list-style:none;padding:10px 0;border:0;background:none}#list li.fltact button{width:100%;min-height:48px}
.lvl li{padding:6px 4px;border-bottom:1px dashed var(--line);font-size:14px;list-style:none}.lvl li small{color:var(--muted)}
.stats2{font-size:13px;color:var(--muted);margin:0 2px 8px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.tabs .fltbrig{flex:1 1 160px;min-width:0}.tabs .fltx{flex:0 0 auto}
@media (max-width:560px){.tabs .fltbrig{flex-basis:100%;order:3}}
.tabs button{flex:1;font-weight:600;font-size:clamp(13px,3.9vw,16px);padding:0 6px;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* список */
#list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{padding:12px 12px 12px 12px;border-bottom:1px solid var(--line);border-left:7px solid var(--line);background:var(--surface);scroll-margin-top:130px}
.row:last-child{border-bottom:0}
.row.s-work{border-left-color:var(--work)} .row.s-off{border-left-color:var(--off)} .row.s-sick{border-left-color:var(--sick)}
.row.s-pl{border-left-color:var(--pl)} .row.s-ul{border-left-color:var(--ul)} .row.s-ab{border-left-color:var(--ab)}
.row.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--flash)}to{background:var(--surface)}}
.who b{font-size:17px;font-weight:650;word-break:break-word}
.who b .tn{display:inline;font-size:15px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;margin-right:7px}
.who span{display:block;font-size:13px;color:var(--muted)}
.plan{font-size:13px;color:var(--muted);margin-top:2px}
.plan.po{color:var(--off-t);font-weight:600}
.head{display:flex;gap:8px;align-items:flex-start}
.head .who{flex:1;min-width:0}
.head .more{flex:none;width:44px;min-height:44px;padding:0;font-size:22px;line-height:1;color:var(--muted);margin:-6px -6px 0 0}
.btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.btns button{min-height:52px;font-weight:700;font-size:clamp(13px,3.6vw,15.5px);padding:0 2px;min-width:0;white-space:nowrap}
.btns button[aria-pressed=true],.extra button[aria-pressed=true]{color:#fff}
button.work[aria-pressed=true]{background:var(--work);border-color:var(--work)}
button.off[aria-pressed=true]{background:var(--off);border-color:var(--off)}
button.sick[aria-pressed=true]{background:var(--sick);border-color:var(--sick)}
button.pl[aria-pressed=true]{background:var(--pl);border-color:var(--pl)}
button.ul[aria-pressed=true]{background:var(--ul);border-color:var(--ul)}
button.ab[aria-pressed=true]{background:var(--ab);border-color:var(--ab)}
.extra{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.extra button{min-height:46px;font-weight:600;font-size:clamp(12px,3.7vw,14px);white-space:normal;line-height:1.15;padding:4px 4px;min-width:0;hyphens:auto;-webkit-hyphens:auto}
.hours{display:flex;flex-wrap:nowrap;align-items:center;gap:4px;margin-top:8px}
.hours .step{width:40px;flex:0 0 40px;padding:0;font-size:22px;font-weight:600}
.hours .val{min-width:44px;flex:0 0 auto;white-space:nowrap;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.hours .chips{display:flex;gap:4px;flex-wrap:nowrap;flex:1 1 auto;min-width:0;margin-left:4px}
.hours .chips button{flex:1 1 0;min-width:0;max-width:56px;padding:0 2px;font-variant-numeric:tabular-nums}
.hours .chips button[aria-pressed=true]{background:var(--work-bg);border-color:var(--work);color:var(--work-t);font-weight:700}
.empty{padding:26px 16px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.empty p{margin:0 0 12px}
.empty .primary{margin:4px}

/* окна */
#sheetWrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet{position:relative;width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh h2{margin:0;font-size:19px}
.sh button{width:44px;padding:0;font-size:20px}
.urow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.urow .uinfo{flex:1;min-width:0;overflow-wrap:anywhere}.urow .uinfo div{font-size:14px}.urow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.urow button{flex:0 0 auto;min-height:40px}.urow.uoff{opacity:.6}
.uaddb{width:100%;margin:6px 0}.udel{width:100%;margin-top:14px;min-height:44px;color:var(--ab-t);border-color:var(--ab)}.uform{display:flex;flex-direction:column;gap:6px}.uform input,.uform select{width:100%;box-sizing:border-box;min-height:44px;font-size:16px}.uform label{font-size:14px;color:var(--muted)}.uform .ucb{display:flex;gap:8px;align-items:center;color:var(--ink)}.uform .ucb input{width:auto;min-height:0}
.list2{display:flex;flex-direction:column;gap:8px}
.list2 button{text-align:left;min-height:52px;font-weight:600;padding:8px 14px}
.list2 button small{display:block;font-weight:400;color:var(--muted)}
.fld{margin:0 0 12px} .fld label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px} .acts button{flex:1;min-width:120px}
.note{font-size:14px;color:var(--muted)}
.prow{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .t{flex:1;min-width:0} .prow .t b{display:block;font-weight:600} .prow .t span{font-size:13px;color:var(--muted)}
.prow button{min-height:40px}
.prow.arch{opacity:.65}
textarea.rep{min-height:200px;font-size:14px;line-height:1.45;white-space:pre}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;padding:0;font-size:22px} .stepper .val{min-width:70px;text-align:center;font-size:20px;font-weight:700}
#toast{position:fixed;left:50%;transform:translate(-50%,8px);bottom:calc(74px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:40;max-width:calc(100% - 28px);text-align:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
#toast.on{opacity:1;transform:translate(-50%,0)}
.banner{background:var(--sick-bg);border-left:6px solid var(--sick);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
/* нижняя панель: День / Месяц */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#tabbar button{flex:1 1 auto;min-width:0;border:0;border-radius:0;min-height:54px;background:transparent;font-weight:700;font-size:clamp(12px,3.6vw,16px);padding:0 4px;white-space:nowrap;color:var(--muted);border-top:3px solid transparent}
#tabbar button[aria-current=page]{color:var(--ink);border-top-color:var(--ink)}
body.kb #tabbar{display:none}
/* вкладка «Месяц» */
#month{display:none}
body.vmonth #month{display:block}
body.vmonth .row2,body.vmonth #dateBtn,body.vmonth #stats,body.vmonth #tabs,body.vmonth #list,body.vmonth #msg{display:none}
body.vmonth #menuBtn{margin-left:auto}
#docs{display:none}
body.vdocs #docs{display:block}
body.vdocs .row2,body.vdocs #stats,body.vdocs #tabs,body.vdocs #list,body.vdocs #msg{display:none}
#nd{display:none}
body.vnd #nd{display:block}
body.vnd .row2,body.vnd .books,body.vnd #dateBtn,body.vnd #stats,body.vnd #tabs,body.vnd #list,body.vnd #msg{display:none}
body.vnd #menuBtn{margin-left:auto}
.ndkinds button{flex:1 1 0;min-width:0;min-height:44px;font-size:clamp(10px,3.2vw,12px);line-height:1.15;padding:2px 2px;hyphens:manual;-webkit-hyphens:manual}
.ndkinds .ndlogt span{font-weight:400}
.ndobjs{margin-bottom:6px}
.ndobjs button{flex:1 1 0;min-width:0;min-height:40px;font-size:clamp(11px,3.3vw,14px);padding:2px;font-weight:700;letter-spacing:.02em}
.dh2 .ndob{font-size:.8em;color:var(--muted,#777);font-weight:600;white-space:nowrap}
.ndlogtools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.ndlogtools input{flex:1 1 100%;min-width:0}
.ndlogtools select{flex:1 1 0;min-width:0;width:auto}
.ndedit{background:var(--surface);border-left:6px solid var(--ul);border-radius:6px;padding:8px 10px;font-size:14px;margin:6px 0 10px}
.ndedit button{min-height:34px;font-size:13px;margin-top:6px}
.ndteamtools{display:flex;flex-direction:column;gap:6px;margin:0 0 8px}
.ndonly{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.ndonly input{width:20px;height:20px}
.ndgrp summary .ndcnt{font-weight:400;color:var(--muted);font-size:13px}
.ndcbs{display:flex;flex-direction:column;padding:4px 0}
.ndcb{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.ndcb input[type=checkbox]{width:20px;height:20px;flex:none;margin:1px 0 0}
.ndcb span{flex:1;min-width:0;display:flex;flex-direction:column}
.ndcb small{color:var(--muted);font-size:12px}
.ndcb.oth input[type=text]{flex:1 1 100%;margin-left:30px;width:calc(100% - 30px)}
.ndj{display:flex;gap:6px 8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ndj:last-child{border-bottom:0}
.ndjt{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px}
.ndjt small{color:var(--muted);font-size:12px}
.ndjt .ndwarn{color:var(--sick-t)}
.ndon{font-size:12px;font-weight:700;color:var(--work-t,inherit)}
.ndjb{display:flex;gap:6px;flex:1 1 100%;flex-wrap:wrap}
.ndjb button{min-height:36px;font-size:13px;padding:0 6px;flex:1;white-space:nowrap}
.dwrap{padding:4px 0 90px}
.dh2{font-size:20px;margin:12px 0 4px}
.dh3{font-size:16px;margin:14px 0 6px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.dgrid>.fld{min-width:0}
/* поля даты и времени на iPhone: без собственной минимальной ширины, ровно по колонке */
input[type=time],input[type=date],input[type=number]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;box-sizing:border-box;display:block}
input[type=time]::-webkit-date-and-time-value,input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
input,select,textarea{min-width:0;max-width:100%;box-sizing:border-box}
.dwrap textarea,.dwrap select,.dwrap input[type=text],.dwrap input[type=time],.dwrap input[type=date],.dwrap input[type=number],.dwrap input[type=search]{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.mlist{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow input{width:22px;height:22px;flex:none}
.mrow .mn{color:var(--muted);font-weight:700;min-width:44px}
.mrow .mf{flex:1;min-width:0;display:flex;flex-direction:column}
.mrow .mf small,.mrow .mh small{color:var(--muted);font-size:12px}
.mrow .mh{text-align:right;font-size:13px;display:flex;flex-direction:column}
.mrow:not(.on){opacity:.6}
.mobj{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 10px;background:var(--surface)}
.mobjh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.mobjh button{min-height:36px;font-size:14px}
.mtype{display:flex;gap:0;margin:12px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mtype button{flex:1;border:0;border-radius:0;min-height:44px;font-weight:700;background:var(--surface);color:var(--muted)}
.mtype button[aria-selected=true]{background:var(--ink);color:var(--bg)}

<script>
(function(){
'use strict';

var KEY='tabel-app-v1';
var APP_VER='176';   /* версия приложения: та же цифра лежит в version.txt на сайте */
var SEED=null;   /* __SEED__ */

/* ------------------------------------------------------------- справочники */
var BOOKS={rf:'РФ',are:'АРЕ'};
var STAT=[['work','Пришёл'],['off','Выходной'],['sick','Больничный'],['pl','Отпуск'],['ul','Отпуск без ЗП'],['ab','Прогул']];
var LBL={}; STAT.forEach(function(x){ LBL[x[0]]=x[1]; });
var CELL={off:'В',sick:'Б',pl:'ОТ',ul:'БС',ab:'ПР'};
var SCHEDS=[
  {id:'',name:'График не задан',short:''},
  {id:'std',name:'5/2 · вс–чт рабочие, выходные пт и сб',short:'График 5/2'},

  {id:'g1',name:'№1 · 24/6 (день) ПК АРЕ',short:'График №1',from:1,to:6},
  {id:'g2',name:'№2 · 24/6 (день) ПК АРЕ',short:'График №2',from:7,to:12},
  {id:'g3',name:'№3 · 24/6 (день) ПК АРЕ',short:'График №3',from:13,to:18},
  {id:'g4',name:'№4 · 24/6 (день) ПК АРЕ',short:'График №4',from:19,to:24},
  {id:'g5',name:'№5 · 24/6 (день) ПК АРЕ',short:'График №5',from:25,to:30}
];
var MONTHS_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONTHS_N=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var WD=['вс','пн','вт','ср','чт','пт','сб'];
var WD_FULL=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
var ST_OK={work:1,off:1,sick:1,pl:1,ul:1,ab:1};

/* ------------------------------------------------------------- мелочи */
function $(id){ return document.getElementById(id); }
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseYmd(s){ var a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function addDays(s,n){ var d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function today(){ return ymd(new Date()); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtH(h){ return String(h).replace('.',','); }
function clampH(h){ h=Number(h); return isFinite(h)?Math.min(24,Math.max(0,Math.round(h*2)/2)):8; }
function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function daysIn(m){ var a=m.split('-').map(Number); return new Date(a[0],a[1],0).getDate(); }
function schedById(id){ return SCHEDS.filter(function(x){ return x.id===id; })[0]; }
function validSched(v){ return schedById(v)?v:''; }
function normNum(n){ n=String(n).trim().replace(/^0+/,''); return n||'0'; }
var AR={}; for(var i=0;i<10;i++){ AR[String.fromCharCode(0x0660+i)]=String(i); AR[String.fromCharCode(0x06F0+i)]=String(i); }
function latinDigits(s){ return String(s).replace(/[\u0660-\u0669\u06F0-\u06F9]/g,function(c){ return AR[c]; }); }

/* графики 24/6 №1–5 (день) ПК АРЕ — по файлу «Графики Филиал 2026» (правки от 01.07.2026).
   По дню: В — выходной, П — нерабочий праздничный день, цифра — часы работы. */
var SCHED_CAL={g1:{'2026-10':'ВВВВВВ8П9999999В9999999999999В9','2026-11':'ВВВВВВ9999999999999В9999999999','2026-12':'ВВВВВВ99999999999В999999999999В'},g2:{'2026-10':'9В9999ВПВВВВ9999999999В99999999','2026-11':'999999ВВВВВВ99999999999999В999','2026-12':'999999ВВВВВВ999999999999В99999В'},g3:{'2026-10':'9В99998П9999ВВВВВВ99999999999В9','2026-11':'999999999999ВВВВВВ99999999В999','2026-12':'999999999999ВВВВВВ999999999999В'},g4:{'2026-10':'9999998ПВ999999999ВВВВВВ9999999','2026-11':'99999В999999999999ВВВВВВ999999','2026-12':'999В999999В9999999ВВВВВВ999999В'},g5:{'2026-10':'9999998ПВ999999999999999ВВВВВВВ','2026-11':'999999999999В99999999999ВВВВВВ','2026-12':'9999999999В999999В999999ВВВВВВВ'}};
/* нерабочие праздничные дни для всех графиков без своего календаря (табель РФ и др.) */
var HOL_ALL={'2026-10-08':1};
function planCode(p,ds){ var c=SCHED_CAL[p.sched], s=c&&c[ds.slice(0,7)]; if(!s) return p.sched&&HOL_ALL[ds]?'П':''; return s.charAt(Number(ds.slice(8,10))-1)||''; }
function planHol(p,ds){ return planCode(p,ds)==='П'; }
function planHours(p,ds){ var c=planCode(p,ds); return /^\d$/.test(c)?Number(c):0; }
function planOff(p,ds){
  if(!p.sched) return null;
  var pc=planCode(p,ds); if(pc) return pc==='В'||pc==='П';
  var d=parseYmd(ds);
  if(p.sched==='std'){ var w=d.getDay(); return w===5||w===6; }
  if(p.sched==='w61') return d.getDay()===5;
  var g=schedById(p.sched); if(!g||!g.from) return null;
  var n=d.getDate(); return n>=g.from&&n<=g.to;
}

/* ------------------------------------------------------------- данные */
function blank(){ return {people:[],records:{},object:'',defH:8}; }
function normalize(s){
  var b=blank();
  if(!s||typeof s!=='object') return b;
  if(Array.isArray(s.people)){
    var seen={};
    s.people.forEach(function(p){
      if(p&&typeof p.id==='string'&&typeof p.name==='string'&&p.name.trim()&&p.id!=='__proto__'&&!seen[p.id]){
        seen[p.id]=1;
        b.people.push({id:p.id,name:p.name.trim().slice(0,120),role:typeof p.role==='string'?p.role.slice(0,120):'',
          num:typeof p.num==='string'?p.num.slice(0,20):(typeof p.num==='number'?String(p.num):''),sched:validSched(p.sched),archived:!!p.archived,added:Number(p.added)>0?Number(p.added):0,upd:Number(p.upd)>0?Number(p.upd):0,fired:/^\d{4}-\d{2}-\d{2}$/.test(String(p.fired||''))?p.fired:''});
      }
    });
  }
  if(s.records&&typeof s.records==='object'){
    Object.keys(s.records).forEach(function(d){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      var day=s.records[d]; if(!day||typeof day!=='object') return;
      var out={}, any=false;
      Object.keys(day).forEach(function(id){
        if(id==='__proto__') return;
        var r=day[id];
        if(r&&ST_OK[r.s]===1){ out[id]={s:r.s,h:r.s==='work'?clampH(r.h):0,t:Number(r.t)>0?Number(r.t):0}; any=true; }
      });
      if(any) b.records[d]=out;
    });
  }
  if(typeof s.object==='string') b.object=s.object.slice(0,80);
  var dh=Number(s.defH); if(dh>0&&dh<=24) b.defH=Math.round(dh*2)/2;
  return b;
}
function blankRoot(){ return {v:2,cur:'rf',books:{rf:blank(),are:blank()}}; }
function normalizeRoot(raw){
  var r=blankRoot();
  if(raw&&raw.books&&typeof raw.books==='object'){
    r.books.rf=normalize(raw.books.rf); r.books.are=normalize(raw.books.are);
    if(raw.cur==='are') r.cur='are';
  } else if(raw&&Array.isArray(raw.people)){ r.books.rf=normalize(raw); }
  return r;
}
var storageOK=true;
function load(){
  try{ var raw=localStorage.getItem(KEY); if(raw) return normalizeRoot(JSON.parse(raw)); }catch(e){}
  return blankRoot();
}
/* во всех списках — по возрастанию табельного номера; без номера — в конце, по алфавиту */
function numKey(n){ var d=String(n==null?'':n).replace(/\D/g,''); return d?Number(d):Infinity; }
function byNum(a,b){
  var x=numKey(a.num), y=numKey(b.num);
  if(x!==y) return x<y?-1:1;
  return String(a.name||'').localeCompare(String(b.name||''),'ru');
}
function sortPeople(r){ ['rf','are'].forEach(function(k){ if(r&&r.books&&r.books[k]&&Array.isArray(r.books[k].people)) r.books[k].people.sort(byNum); }); }
function save(){ sortPeople(root); try{ localStorage.setItem(KEY,JSON.stringify(root)); }catch(e){ storageOK=false; renderBanner(); } }
try{ localStorage.setItem(KEY+'-t','1'); localStorage.removeItem(KEY+'-t'); }catch(e){ storageOK=false; }

var root=load(); sortPeople(root);
function hasPeople(r){ return r.books.rf.people.length+r.books.are.people.length>0; }
if(SEED&&!hasPeople(root)){ root=normalizeRoot(SEED); save(); }
function bk(){ return root.books[root.cur]; }
/* уволенные: с даты увольнения в явке стоит «уволен», в следующем месяце человека в списке уже нет */
function firedOn(p,d){ return !!(p&&p.fired&&String(d)>=p.fired); }
function firedGone(p,d){ return !!(p&&p.fired&&String(d).slice(0,7)>p.fired.slice(0,7)); }
function firedDmy(p){ var a=String(p.fired||'').split('-'); return a.length===3?a[2]+'.'+a[1]+'.'+a[0]:''; }
function activePeople(){ return bk().people.filter(function(p){ return !p.archived&&!firedGone(p,ui.date); }); }
function person(id){ return bk().people.filter(function(p){ return p.id===id; })[0]; }
function dayRec(d){ return bk().records[d]||{}; }

var MON=/[?&]mon\b/.test(location.search);
document.addEventListener('input',function(e){ var t=e.target; if(!t||!t.dataset) return;
  if(!(((t.dataset.tki!=null||t.dataset.tke!=null)&&t.dataset.tkk==='t')||/^ext_t_/.test(t.id||'')||(t.dataset.pfx&&/\|t$/.test(t.dataset.pfx)))) return;
  var v=t.value, up=v.replace(/[a-z]+/g,function(m){ return m.toUpperCase(); }); if(up===v) return;
  var a=t.selectionStart, b=t.selectionEnd; t.value=up; try{ t.setSelectionRange(a,b); }catch(er){} },true);
var ui={date:today(),follow:true,filter:'all',q:'',open:{},undo:null,numMode:true,view:'day',month:today().slice(0,7)};

/* ------------------------------------------------------------- синхронизация с Google Таблицей */
var SYNC_KEY='tabel-app-sync-v1';
var URL_RE=/^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[\w-]+\/exec$/;
var LOCAL_RE=/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//;
var CF_RE=/^https:\/\/[\w-]+\.demonlightseven\.workers\.dev\/?$/;
function okUrl(u){ return URL_RE.test(u)||CF_RE.test(u)||LOCAL_RE.test(u); }
function loadSync(){
  var d={url:'',code:'',who:'',queue:{},lastOk:0,rev:{},pq:[],aq:[]};
  try{
    var o=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');

/* люди, добавленные или изменённые на других телефонах (список приходит из таблицы с каждым ответом) */
function applyAdded(a){
  if(!a||typeof a!=='object') return;
  var added=[], cur=false, edited=false;
  ['rf','are'].forEach(function(b){
    var list=a[b]; if(!Array.isArray(list)||!list.length) return;
    var bb=root.books[b], byNum={}, skip={};
    bb.people.forEach(function(p){ if(p.num) byNum[normNum(p.num)]=p; });
    (sync.pq||[]).forEach(function(x){ if(x.b===b) x.nums.forEach(function(n){ skip[normNum(n)]=1; }); });   // удаляем — не возвращать
    (sync.aq||[]).forEach(function(x){ if(x.b===b) skip[normNum(x.p.n)]=1; });                            // своё изменение ещё не отправлено
    list.forEach(function(x){
      if(!Array.isArray(x)||!x[0]||!x[1]) return;
      var k=normNum(x[0]), t=Number(x[4])||0, fx=/^\d{4}-\d{2}-\d{2}$/.test(String(x[5]||''))?String(x[5]):''; if(skip[k]) return;
      var p=byNum[k];

        bb.people.push(p); byNum[k]=p; added.push(p.name); if(b===root.cur) cur=true;
      } else if(t>1&&t>(p.upd||0)){   // t=1 — запись из сверки: только добавляет, чужие правки не трогает
        var ch=p.name!==x[1]||p.role!==(x[2]||'')||p.sched!==validSched(x[3])||(p.fired||'')!==fx;
        p.name=String(x[1]).slice(0,120); p.role=String(x[2]||'').slice(0,120); p.sched=validSched(x[3]); p.fired=fx; p.upd=t;
        if(ch){ edited=true; if(b===root.cur) cur=true; }

  });

function applyClears(list){
  if(!Array.isArray(list)||!list.length) return;
  var n=0, cur=false, re=/^\d{4}-\d{2}-\d{2}$/;
  list.forEach(function(c){
    if(!c||!re.test(c.from)||!re.test(c.to)) return;
    var t=Number(c.t)||0;
    ['rf','are'].forEach(function(b){
      if(c.b!=='*'&&c.b!==b) return;
      var recs=root.books[b].records;
      Object.keys(recs).forEach(function(d){
        if(d<c.from||d>c.to) return;
        var day=recs[d];
        Object.keys(day).forEach(function(id){ if((Number(day[id].t)||0)<=t){ delete day[id]; n++; if(b===root.cur) cur=true; } });
        if(!Object.keys(day).length) delete recs[d];

      Object.keys(sync.queue).forEach(function(k){ var it=sync.queue[k]; if(it&&it.b===b&&it.d>=c.from&&it.d<=c.to&&(Number(it.t)||0)<=t) delete sync.queue[k]; });
    });
  });

function applyGone(g){

  ['rf','are'].forEach(function(b){
    var list=g[b]; if(!Array.isArray(list)||!list.length) return;
    var gt={};

    var ids=[];

      if(!p.num) return; var t=gt[normNum(p.num)];

function mergePull(b,d0,items){

function submitEntry(){ if(!canDay(true)) return;
  var q=$('q'), text=latinDigits(q.value).trim();

  var toks=text.split(/[\s,;]+/).filter(Boolean).map(function(x){ return x.replace(/^[№#]/,''); });
  var allNum=toks.length&&toks.every(function(x){ return /^\d+$/.test(x); });
  var ppl=activePeople();
  if(!allNum){
    var found=ppl.filter(function(p){ return matches(p,text); });
    if(found.length===1){ markPresent([found[0]],[],text); return; }
    showMsg(found.length?'Найдено: '+found.length+'. Нажмите «Пришёл» у нужного человека в списке или введите табельный номер.':'Никого не найдено.',found.length?'warn':'bad');

  }
  var by={}; ppl.forEach(function(p){ if(p.num) (by[normNum(p.num)]=by[normNum(p.num)]||[]).push(p); });
  var seen={}, hit=[], unknown=[], dup=[];
  toks.forEach(function(t){
    var k=normNum(t); if(seen[k]) return; seen[k]=1;
    var m=by[k];

function monthCsv(month){
  var n=daysIn(month), rows=[], head=['Таб. №','ФИО','Должность'];

function saveFile2(name,mime,content){

function download(name,mime,content){

  }catch(e){ return 'fail'; }

function deletePeopleIn(bookId,ids){
  var b=root.books[bookId], set={}, marks=0; ids.forEach(function(i){ set[i]=1; });
  var gone={}; b.people.forEach(function(p){ if(set[p.id]&&p.num) gone[p.num]=1; });
  b.people=b.people.filter(function(p){ return !set[p.id]; });
  b.people.forEach(function(p){ if(p.num) delete gone[p.num]; });          // номер ещё есть у другого человека
  Object.keys(b.records).forEach(function(d){
    var day=b.records[d];
    Object.keys(day).forEach(function(id){ if(set[id]){ delete day[id]; marks++; } });
    if(!Object.keys(day).length) delete b.records[d];
  });
  Object.keys(sync.queue).forEach(function(k){ var it=sync.queue[k]; if(it.b===bookId&&gone[it.n]) delete sync.queue[k]; });   // неотправленные отметки удалённых не нужны

}

function decryptPack(pack,pass){
  if(!window.crypto||!crypto.subtle) return Promise.reject(new Error('nocrypto'));
  if(!pack||pack.v!==1||pack.kdf!=='PBKDF2-SHA256'||!(pack.iter>=100000&&pack.iter<=2000000)) return Promise.reject(new Error('format'));
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pass.normalize('NFC')),'PBKDF2',false,['deriveKey'])
    .then(function(k){ return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(pack.salt),iterations:pack.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']); })
    .then(function(key){ return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(pack.iv)},key,b64d(pack.data)); })
    .then(function(buf){ return new TextDecoder().decode(buf); });
}

  else{
    ['rf','are'].forEach(function(b){
      var dst=root.books[b];
      src.books[b].people.forEach(function(p){
        var ex=p.num?dst.people.filter(function(x){ return x.num===p.num; })[0]:dst.people.filter(function(x){ return !x.num&&x.name===p.name; })[0];

    .then(function(st){

/* вырезать из кадра полосу внутри рамки, сделать чёрно-белой и контрастной */
function scanFrame(){
  var v=$('scVid'); if(!v||!v.videoWidth) return null;
  var vw=v.videoWidth, vh=v.videoHeight, box=v.getBoundingClientRect(), fr=document.querySelector('#scan .scframe i').getBoundingClientRect();
  var k=Math.max(box.width/vw,box.height/vh), ox=(box.width-vw*k)/2, oy=(box.height-vh*k)/2;   // видео растянуто как object-fit:cover
  var sx=Math.max(0,(fr.left-box.left-ox)/k), sy=Math.max(0,(fr.top-box.top-oy)/k), sw=Math.min(vw-sx,fr.width/k), sh=Math.min(vh-sy,fr.height/k);
  if(sw<10||sh<10) return null;
  var scale=Math.min(2,Math.max(1,120/sh)), c=document.createElement('canvas'); c.width=Math.round(sw*scale); c.height=Math.round(sh*scale);
  var x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
  var im=x.getImageData(0,0,c.width,c.height), p=im.data, mn=255, mx=0, i, g;
  for(i=0;i<p.length;i+=4){ g=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000; p[i]=g; if(g<mn) mn=g; if(g>mx) mx=g; }
  var rg=Math.max(1,mx-mn);
  for(i=0;i<p.length;i+=4){ g=(p[i]-mn)*255/rg; p[i]=p[i+1]=p[i+2]=g; }
  x.putImageData(im,0,0); return c;
}
function scanLoop(){
  if(!scan.on) return;
  if(scan.busy||!scan.worker){ scan.timer=setTimeout(scanLoop,300); return; }
  var c=scanFrame(); if(!c){ scan.timer=setTimeout(scanLoop,300); return; }
  scan.busy=true;
  scan.worker.recognize(c).then(function(r){
    scan.busy=false; if(!scan.on) return;
    var all=latinDigits(r&&r.data&&r.data.text||'').match(/\d+/g)||[];
    var toks=all.filter(function(x){ return x.length>=4&&x.length<=5; });
    var hit=null;
    toks.forEach(function(t){ if(!hit&&findByNum(root.cur,t)) hit=t; });
    // к номеру могли прилипнуть лишние цифры (например, от надписи «Таб. №») — ищем внутри известный номер
    all.forEach(function(x){
      if(hit||x.length<=5) return;
      for(var L=5;L>=4&&!hit;L--) for(var i=0;i+L<=x.length&&!hit;i++){ var sub=x.substr(i,L); if(findByNum(root.cur,sub)) hit=sub; }
    });
    var n=hit||toks[0]||'';
    if(n&&n===scan.last) scan.lastN++; else { scan.last=n; scan.lastN=n?1:0; }
    if(n&&scan.lastN>=2) onScanned(n);   // одно и то же число прочитано два раза подряд — не ошибка распознавания
    scan.timer=setTimeout(scanLoop,150);
  }).catch(function(){ scan.busy=false; scan.timer=setTimeout(scanLoop,600); });
}
function findByNum(bookId,n){
  var k=normNum(n); return root.books[bookId].people.filter(function(p){ return p.num&&!p.archived&&normNum(p.num)===k; })[0]||null;
}
function scanBeep(ok){
  try{ if(navigator.vibrate) navigator.vibrate(ok?80:[60,60,60]); }catch(e){}
  try{
    var A=window.AudioContext||window.webkitAudioContext; if(!A) return;
    scan.ac=scan.ac||new A(); var o=scan.ac.createOscillator(), g=scan.ac.createGain();
    o.frequency.value=ok?1320:330; g.gain.value=0.08; o.connect(g); g.connect(scan.ac.destination); o.start(); o.stop(scan.ac.currentTime+(ok?0.12:0.25));
  }catch(e){}
}
function onScanned(n){
  var k=normNum(n), now=Date.now();
  if(scan.cool[k]&&now-scan.cool[k]<5000) return;   // эту карточку только что отметили
  scan.cool[k]=now; scan.last=''; scan.lastN=0;
  var p=findByNum(root.cur,n);
  if(!p){
    var other=findByNum(root.cur==='rf'?'are':'rf',n);
    scanBeep(false);
    scanMsg('№ '+n+' — нет в табеле '+BOOKS[root.cur]+(other?' (он в табеле '+BOOKS[root.cur==='rf'?'are':'rf']+')':''),'bad');
    return;
  }

  if(cur&&cur.s==='work'){ scanBeep(true); scanMsg('✓ '+p.num+' '+p.name+' — уже отмечен: пришёл, '+fmtH(cur.h)+' ч','ok'); return; }
  day[p.id]={s:'work',h:bk().defH,t:now};
  save(); track(root.cur,ui.date,p.id);
  scan.count++; $('scCnt').textContent=' ('+scan.count+')';
  scanBeep(true);
  scanMsg('✓ '+p.num+' '+p.name+' — пришёл, '+fmtH(bk().defH)+' ч'+(cur?' (было: '+(LBL[cur.s]||cur.s)+')':''),'ok');
}

/* ---- сборка .docx: шаблон с сайта + простой zip без сжатия */
var memoTpl={};
function memoTemplate(t){

function xesc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* записка о сверхурочной работе: без столбцов «Перерыв с / по»; их ширина отдаётся столбцу «Ф.И.О.» */
function memoNoBreak(doc,row){
  var i=doc.indexOf('Перерыв'); if(i<0) return {doc:doc,row:row};
  var a=doc.lastIndexOf('<w:tbl>',i), b=doc.indexOf('</w:tbl>',i); if(a<0||b<0) return {doc:doc,row:row};
  var tbl=doc.slice(a,b), cols=tbl.match(/<w:gridCol [^>]*\/>/g)||[];
  var cw=function(x){ return Number((/w:w="(\d+)"/.exec(x)||[])[1]||0); };
  if(cols.length!==15||cw(cols[8])+cw(cols[9])<=0) return {doc:doc,row:row};
  var add=cw(cols[8])+cw(cols[9]);
  var cells=function(r){ return r.match(/<w:tc>[\s\S]*?<\/w:tc>/g)||[]; };
  var widen=function(c){ return c.replace(/(<w:tcW w:w=")(\d+)/,function(m,p1,p2){ return p1+(Number(p2)+add); }); };
  var grid=tbl.match(/<w:tblGrid>[\s\S]*?<\/w:tblGrid>/)[0], ng='<w:tblGrid>'+cols.map(function(c,k){ return k===2?c.replace(/w:w="(\d+)"/,function(m,v){ return 'w:w="'+(Number(v)+add)+'"'; }):(k===8||k===9?'':c); }).join('')+'</w:tblGrid>';
  var rows=tbl.match(/<w:tr[ >][\s\S]*?<\/w:tr>/g)||[], nt=tbl.replace(grid,ng);
  rows.forEach(function(rw){
    var cs=cells(rw), nr=rw;
    if(rw.indexOf('Перерыв')>=0){ cs.forEach(function(c){ if(c.indexOf('Перерыв')>=0) nr=nr.replace(c,''); else if(c.indexOf('Ф.И.О.')>=0) nr=nr.replace(c,widen(c)); }); }
    else if(cs.length===13&&cs[7].replace(/<[^>]+>/g,'').trim()==='с'&&cs[8].replace(/<[^>]+>/g,'').trim()==='по'){ nr=nr.replace(cs[2],widen(cs[2])).replace(cs[7],'').replace(cs[8],''); }
    else nr=nr.replace(/<w:gridSpan w:val="14"\s*\/>/,'<w:gridSpan w:val="12" />').replace(/<w:gridSpan w:val="11"\s*\/>/,'<w:gridSpan w:val="9" />');
    nt=nt.replace(rw,nr);
  });
  var nrow=row; cells(row).forEach(function(c){ if(c.indexOf('{{BF}}')>=0||c.indexOf('{{BT}}')>=0) nrow=nrow.replace(c,''); else if(c.indexOf('{{FIO}}')>=0) nrow=nrow.replace(c,widen(c)); });
  return {doc:doc.slice(0,a)+nt+doc.slice(b),row:nrow};
}
function memoSignTable(doc,sg){
  var i=doc.indexOf('{{S1POS}}'); if(i<0||!sg) return doc;
  var a=doc.lastIndexOf('<w:tbl>',i), b=doc.indexOf('</w:tbl>',i); if(a<0||b<0) return doc;
  var tbl=doc.slice(a,b), rows=tbl.match(/<w:tr[ >][\s\S]*?<\/w:tr>/g)||[];
  var find=function(k){ return rows.filter(function(x){ return x.indexOf(k)>=0; })[0]; };
  var rS=find('{{S1POS}}'), rA=find('{{S2POS}}'), rP=find('{{S3POS}}')||find('{{S4POS}}'), rH=find('СОГЛАСОВАНО');
  if(!rS||!rA||!rP) return doc;

function arWord(w){

  var out=''; for(var i=0;i<l.length;i++){ var c=l.charAt(i); if(i===0&&AR_INIT[c]!=null){ out+=AR_INIT[c]; continue; } if(i>0&&c===l.charAt(i-1)&&/[бвгджзклмнпрстфхш]/.test(c)) continue; out+=AR_TR[c]!=null?AR_TR[c]:c; }

function nameAr(name){
  var toks=String(name||'').replace(/-/g,' ').split(/\s+/).filter(Boolean), out=[], art=false;
  toks.forEach(function(t){
    var l=t.toLowerCase();
    if(AR_ART[l]===1){ art=true; return; }
    if(AR_ART[l]===2){ out.push('عبد'); art=true; return; }

  });

var apiChecking=false, apiLast=0;
function checkApi(force){
  if(apiChecking||!sync.code||!/^https?:$/.test(location.protocol)||navigator.onLine===false) return;
  if(!force&&Date.now()-apiLast<60000) return;
  apiChecking=true; apiLast=Date.now();
  fetch('api.json?t='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.json():null; }).then(function(o){
    var u=o&&typeof o.url==='string'?o.url.trim():'';
    if(!okUrl(u)||u===sync.url){ apiChecking=false; return; }
    return fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({code:sync.code,action:'ping',who:sync.who,app:APP_VER}),redirect:'follow',cache:'no-store'})
      .then(function(r){ return r.json(); }).then(function(j){

}

/* человек по табельному номеру в обоих табелях */
/* все люди с этим табельным № (РФ и АРЕ) */
function anyPersons(num){
  var n=normNum(num), out=[];
  ['rf','are'].forEach(function(b){ root.books[b].people.forEach(function(p){ if(!p.archived&&p.num&&normNum(p.num)===n) out.push({b:b,p:p}); }); });
  return out;
}
/* человек из состава бригады: если № повторяется, берём того, кого выбрал бригадир (data.pk: № -> rf/are) */
function brigP(b,num){
  var dd=b&&(b.data||b), pk=dd&&dd.pk&&dd.pk[normNum(num)];
  if(pk==='rf'||pk==='are'){ var n=normNum(num), hit=null; root.books[pk].people.forEach(function(p){ if(!hit&&p.num&&normNum(p.num)===n&&!p.archived) hit={b:pk,p:p}; }); if(hit) return hit; }
  return anyPerson(num);
}

  pk=pk||{};

    if(all.length>1){
      return '<div class="xrow xdup"><b>'+(i+1)+'.</b> '+esc(n)+' <span class="xno">одинаковый табельный № у '+all.length+' чел. — выберите, кого взять в бригаду:</span><div class="xdupb">'+
        all.map(function(x){ return '<button type="button" class="ndchip'+(pk[k]===x.b?' on':'')+'" data-a="brgpk" data-n="'+esc(k)+'" data-b="'+x.b+'">'+esc(x.p.name)+' <small>'+BOOKS[x.b]+(x.p.role?' · '+esc(x.p.role):'')+'</small></button>'; }).join('')+'</div></div>';
    }
    var x=all[0]||anyPerson(n);
    var gone=x&&firedOn(x.p,today());
    return '<div class="xrow'+(x&&!gone?'':' xbad')+'"><b>'+(i+1)+'.</b> '+esc(n)+' '+(x?esc(x.p.name)+' <small>'+esc(x.p.role||'')+'</small>'+(gone?' <span class="xno">уволен — проверьте №</span>':''):'<span class="xno">нет на участке — проверьте табельный №</span>')+'</div>';

function myBrigId(d){ return 'brig|'+d+'|'+nameKey(sync.who).slice(0,30); }
function bookDay(b,d){
  var bb=root.books[b], day=(bb.records||{})[d]||{}, norm=memoNorm(b);
  var c={list:0,work:0,ab:0,off:0,dob:0,sick:0,pl:0,ul:0,unm:0,fired:0,ot:0,wo:0};
  bb.people.forEach(function(p){
    if(p.archived||firedGone(p,d)) return;
    if(firedOn(p,d)&&!day[p.id]){ c.fired++; return; }
    c.list++; var r=day[p.id];
    if(!r){ if(planOff(p,d)===true) c.dob++; else c.unm++; return; }
    if(c[r.s]!=null) c[r.s]++;
    if(r.s==='work'){ if(planOff(p,d)===true) c.wo++; else if((Number(r.h)||0)>norm) c.ot++; }   // в выходной по графику — отдельно, не сверхурочка
  });
  return c;
}

var tkSt={}, tkStBusy={};

function tkStatsBody(d){
  var ym=d.slice(0,7), c=tkSt[ym];
  if((!c||Date.now()-c.at>60000)&&!tkStBusy[ym]&&syncOn()){ tkStBusy[ym]=1;
    call({action:'tkstats',ym:ym}).then(function(j){ tkStBusy[ym]=0; var was=JSON.stringify(tkSt[ym]&&tkSt[ym].rows); tkSt[ym]={at:Date.now(),rows:j.rows||[]}; if(was!==JSON.stringify(tkSt[ym].rows)&&(ui.view==='task'||ui.view==='teams')) renderX(); })
      .catch(function(){ tkStBusy[ym]=0; tkSt[ym]={at:Date.now(),rows:(c&&c.rows)||[],err:1}; }); }
  var a=ym.split('-'), head='<div class="tksth">Выполнение наряд-заданий · '+MON_N[Number(a[1])-1]+' '+a[0]+'</div>';
  if(!c) return '<div class="tkst">'+head+'<p class="note">'+(syncOn()?'Загружаю…':'Нужна связь с сервером.')+'</p></div>';

    .sort(function(x,y){ return y.pOk-x.pOk||y.pPart-x.pPart||String(x.brig).localeCompare(String(y.brig),'ru'); });
  if(!rows.length) return '<div class="tkst">'+head+'<p class="note">В этом месяце ещё нет наряд-заданий с отметкой о выполнении.</p></div>';

  function pc(v,n){ return n?Math.round(v*100/n):0; }

    '<div class="tkstr tkstsum"><span>Все бригады</span><b class="tkok">'+pc(tot.ok,tot.n)+'%</b><b class="tkpart">'+pc(tot.part,tot.n)+'%</b><span>'+tot.n+'</span></div>'+

function ndBrigAll(b,d,obj){ var out=[]; ND_K4.forEach(function(x){ out=out.concat(ndBrigOpen(b,d,obj,x[0])); }); return out; }
function ndTeamUnion(nds){ var seen={}, out=[]; nds.forEach(function(e){ (e.team||[]).forEach(function(t){ var k=t.num?'n'+normNum(t.num):'f'+String(t.name||'').toLowerCase(); if(seen[k]) return; seen[k]=1; out.push(t); }); }); return out; }
function ndTbtBtn(obj,d,b,lead){
  var nds=ndBrigAll(b,d,obj), ppl=ndTeamUnion(nds), done=bdItems(d).filter(function(x){ return x.kind==='tbt'&&x.obj===obj; }), g=tbtGate(obj,d,b);
  if(!g.ok) return '<button class="ndtbtb tbtoff" disabled aria-disabled="true"><b>Инструктаж перед началом работ (TBT)</b><small class="tbtwhy">'+esc(g.why)+'</small>'+
    (done.length?'<small class="xok">✔ проведён: '+done.map(function(x){ return esc(whoBase(x.who))+' '+new Date(x.t).toTimeString().slice(0,5); }).join(', ')+'</small>':'')+'</button>';
  return '<button class="ndtbtb" data-a="ndtbt" data-o="'+esc(obj)+'" data-d="'+esc(d)+'" data-b="'+esc(b?b.id:'')+'" data-l="'+esc(lead||'')+'"><b>Инструктаж перед началом работ (TBT)</b>'+
    '<small>'+(nds.length?'Наряды: '+nds.map(function(e){ return '№ '+esc(e.no)+' ('+(ND_SHORT[e.kind]||'')+')'; }).join(', ')+' · '+ppl.length+' чел. без повторов':'Открытых нарядов на эту бригаду нет')+'</small>'+
    (done.length?'<small class="xok">✔ проведён: '+done.map(function(x){ return esc(whoBase(x.who))+' '+new Date(x.t).toTimeString().slice(0,5); }).join(', ')+'</small>':'')+'</button>';
}
function ndTbtFromBrig(obj,d,bid,lead){
  var b=bid?bdItems(d).filter(function(x){ return x.id===bid; })[0]:null, nds=ndBrigAll(b,d,obj), ppl=ndTeamUnion(nds), g=tbtGate(obj,d,b);
  if(!g.ok){ toast(g.why); return; }
  var o=tbtSt(), t=tbtDraft(o,obj);
  t.date=d<today()?today():d; t.place=tbtPlace(obj);
  t.no=nds.map(function(e){ return String(e.no); }).join(', ');
  t.rows=ppl.map(function(x){ var y=x.num?tbtPerson(x.num):null; if(y) return tbtRowOf(y); var pr=tbtProf(x.role,x.b||''); return {num:String(x.num||''),ru:String(x.name||''),lat:tbtLat(x.name),p1:pr.p1,p2:pr.p2}; });
  var ins=nds.map(function(e){ var v=String(e['in']||''); return ND_FM.indexOf(v)>=0?v:ND_FMS.indexOf(v)>=0?'Site Foreman '+v:''; }).filter(Boolean)[0];
  t.resp=ins||(ND_FM.indexOf(t.resp)>=0?t.resp:ND_FM[0]);
  tbtSave(o);
  var st=ndSt(); if(st.edit) ndEndEdit(st); st.obj=obj; st.kind='tbt'; ndSave(st);
  var bv=ui.view==='board'?'board':'task';
  tbtMsg=nds.length?'Из нарядов '+t.no+' ('+whoBase(lead)+'): '+t.rows.length+' чел. без повторов.':'На бригаду '+whoBase(lead)+' нет открытых нарядов — добавьте людей вручную.';
  var lk0=fioKey(lead), keep=ndBack&&ndBack.lk===lk0?ndBack:{}; setView('nd'); ndBack={v:bv,t:'TBT · '+whoBase(lead)+' · '+obj,lk:lk0,tbt:1,nd:keep.nd||0}; renderNd(); window.scrollTo(0,0); toast(tbtMsg);
}
/* бригадир как человек из табеля: по табельному номеру из поданной численности, иначе по ФИО */
function brigLeadPerson(b,lead){
  var x=b&&b.data&&b.data.lnum?brigP(b,b.data.lnum):null; if(x) return x;
  var key=fioKey(lead||(b&&b.data&&b.data.lead)||''); if(!key) return null;
  var hit=ndPeople().filter(function(y){ return fioKey(y.p.name)===key; })[0];
  if(!hit){ var fam=String(lead||'').trim().split(/\s+/)[0].toLowerCase(); var c=ndPeople().filter(function(y){ return String(y.p.name||'').toLowerCase().split(/\s+/)[0]===fam; }); if(c.length===1) hit=c[0]; }
  return hit?{b:hit.b,p:hit.p}:null;
}
/* «Арматурщик 5 разряда», «Айдинов Пулатжон Азизович» -> «Reinforcement worker 5th category Aidinov P. A.» */
function execEn(p){
  var pos=tbtProf(p.role,'rf').p2, a=tbtLat(p.name).trim().split(/\s+/);
  var nm=a[0]+(a.length>1?' '+a.slice(1,3).map(function(w){ return w.charAt(0).toUpperCase()+'.'; }).join(' '):'');
  return (pos?pos+' ':'')+nm;
}
function ndFromBrig(k,obj,d,bid,lead){
  var b=bid?bdItems(d).filter(function(x){ return x.id===bid; })[0]:null;
  var st=ndSt(); if(st.edit) ndEndEdit(st);
  st.obj=obj; st.kind=k; if(ND_TITLE[k]) st.lastKind=k;
  var dr={only:true,team:[],teamX:[]}, miss=[], seen={};
  var slSkip=0, slOnly=slNeed(k,(b&&b.data&&Array.isArray(b.data.tech)&&b.data.tech.length)?b.data.tech.join(', '):ndV(st,k,'tech'));
  if(b) [b.data.lnum].concat(b.data.nums||[]).forEach(function(n){ if(!n) return; var p=brigP(b,n); if(slOnly&&!(p?isSling(p.b,n):isSlingNum(n))){ slSkip++; return; } if(!p){ miss.push(n); return; } var key=p.b+'|'+p.p.id; if(!seen[key]){ seen[key]=1; dr.team.push(key); } });
  var nx=ndNext(st,k); if(nx) dr.no=nx;
  dr.d1=d<today()?today():d;
  if(k==='fire'){ var hz=ndBrigOpen(b,d,obj,'hz'); if(hz.length) dr.rel=String(hz[0].no); }
  if(b&&b.data&&k!=='fire'){ if(Array.isArray(b.data.tech)&&b.data.tech.length) dr.tech=b.data.tech.join(', '); if(Array.isArray(b.data.doc)&&b.data.doc.length) dr.doc=b.data.doc.join('\n'); }
  var lp=brigLeadPerson(b,lead), ex=lp?execEn(lp.p):'';
  if(ex) dr.exec=ex;
  st.draft[obj+'|'+k]=dr; ndSave(st);
  ndQ=''; ndMsg=(b?'Бригада '+whoBase(lead)+': отмечено '+dr.team.length+' чел.'+(slOnly?' (только стропальщики; без удостоверения не включены: '+slSkip+' чел.)':'')+(miss.length?' Нет в табеле: '+miss.join(', ')+'.':''):'Бригадир '+whoBase(lead)+' не подал численность — отметьте людей вручную.')+(dr.exec?(k==='fire'?' Ответственный за проведение: ':' Ответственный исполнитель: ')+dr.exec+'.':'');
  var bv=ui.view==='board'?'board':'task';
  var lk1=fioKey(lead), keep1=ndBack&&ndBack.lk===lk1?ndBack:{}; ndFetchAt=0; setView('nd'); ndBack={v:bv,t:(ND_SHORT[k]||'')+' · '+whoBase(lead)+' · '+obj,lk:lk1,nd:1,tbt:keep1.tbt||0}; renderNd(); window.scrollTo(0,0);
  toast(ndMsg);
  if(k==='fire'&&!dr.rel) toast('Открытого наряда на опасные работы у этой бригады на '+esc(tbtDmy(d))+' нет');
}
function xClick(a,el){
  if(a==='mvcopy'){ mvCopy(); return; }
  if(a==='brgpk'){ var ob=brgSt(), d0=today(), m0=bdItems(d0).filter(function(x){ return x.kind==='brig'&&x.id===myBrigId(d0); })[0]; ob.pk=Object.assign({},(m0&&m0.data&&m0.data.pk)||{},ob.pk||{}); ob.pk[el.dataset.n]=el.dataset.b; brgSave(ob); renderX(); return; }
  if(a==='brgpick'){ brgPickToggle(el.dataset.f,el.dataset.v,false); return; }
  if(a==='brgpickadd'){ var bi=$('brgadd_'+el.dataset.f), bv=bi?bi.value.trim():''; if(!bv){ toast('Впишите, что добавить'); return; } brgPickToggle(el.dataset.f,bv,true); return; }
  if(a==='tkdone'){ tkDoneSave(el); return; }
  if(a==='tkrep'){ tkRepSave(el); return; }
  if(a==='tkall'){ var ke=el.dataset.k, inp=document.querySelector('[data-tkf="'+(window.CSS&&CSS.escape?CSS.escape(ke):ke)+'"]'); if(inp){ inp.value=el.dataset.v; var ka=ke.split('|'); (tkFacts[ka[0]]=tkFacts[ka[0]]||{})[ka[1]]=el.dataset.v; } return; }
  if(a==='tkirow'){ tkItems.push({t:'',v:'',u:''}); renderX(); tkFocusRow(tkItems.length-1); return; }
  if(a==='tkidel'){ var di=Number(el.dataset.i); if(tkItems.length>1) tkItems.splice(di,1); else tkItems=[{t:'',v:'',u:''}]; renderX(); return; }
  if(a==='tkwadd'){ tkwAdd(el.dataset.v); return; }
  if(a==='tkwdel'){ if(confirm('Удалить из памяти?\n\n'+el.dataset.v)) tkwMemOp('del',el.dataset.v); return; }
  if(a==='xdpick'){ sheetXDate(el.dataset.k); return; }
  if(a==='xdshift'){ var nk=el.dataset.k; xDateSet(nk,addDays(xDateGet(nk),Number(el.dataset.d))); sheetXDate(nk); return; }
  if(a==='xdtoday'){ xDateSet(el.dataset.k,today()); closeSheet(); return; }
  if(a==='tkdoneedit'){ tkDoneEdit[el.dataset.id]=1; renderX(); return; }
  if(a==='ndtbt'){ ndTbtFromBrig(el.dataset.o,el.dataset.d,el.dataset.b,el.dataset.l); return; }
  if(a==='ndfrom'){ ndFromBrig(el.dataset.k,el.dataset.o,el.dataset.d,el.dataset.b,el.dataset.l); return; }
  if(a==='tkack'){ var tid=el.dataset.id, td=el.dataset.d; if(!syncOn()){ toast('Нет связи с сервером'); return; } el.disabled=true; el.textContent='Отправляю…';
    bdPut({kind:'ack',d:td,obj:'',id:('ack|'+tid).slice(0,60),data:{tid:tid,fio:sync.who}}).then(function(){ toast('Получение наряд-задания подтверждено'); bdFetch(td,true); }).catch(function(e){ el.disabled=false; el.textContent='Наряд-задание получил'; toast('Не отправлено: '+((e&&e.message)||'')); }); return; }
  if(a==='brgsend'){ brgSend(); return; }
  if(a==='tksend'){ tkSend(); return; }
  if(a==='tkdel'){ if(!confirm('Удалить это наряд-задание?')) return; var d=tkDate||tkDef(); call({action:'bdel',id:el.dataset.id}).then(function(){ bdFetch(d,true); }).catch(function(e){ toast('Не удалено: '+((e&&e.message)||'')); }); return; }
  if(a==='tkday'){ tkDate=addDays(tkDate||tkDef(),Number(el.dataset.d)); if(ui.view==='nd'){ ndBack=null; setView('task'); } else renderX(); return; }
  if(a==='bdday'){ bdDate=addDays(bdDate||today(),Number(el.dataset.d)); renderX(); return; }
  if(a==='tmday'){ tmDate=addDays(tmDate||today(),Number(el.dataset.d)); renderX(); return; }
  if(a==='ktusave'){ ktuSave(el); return; }
}
document.addEventListener('input',function(e){ var t=e.target; if(t&&t.id==='brg_nums'){ var o=brgSt(); o.nums=t.value; brgSave(o); var box=t.parentNode.querySelector('.xlist'); if(box) box.innerHTML=brgListHtml(parseNums(t.value),o.pk||{}); } },true);
document.addEventListener('change',function(e){ var t=e.target; if(t&&t.id==='tk_obj'){ var o=brgSt(); o.tobj=t.value; brgSave(o); } if(t&&t.id==='brg_obj'){ var o2=brgSt(); o2.obj=t.value; brgSave(o2); } },true);

if(MV) mvBoot(); else { applyRole(); if(!auth) showLogin(''); }
})();
