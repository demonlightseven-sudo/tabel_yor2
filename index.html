<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161B20" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Табель">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Табель</title>
<style>
:root{
  box-sizing:border-box;
  --bg:#F1EFEA; --surface:#FBFAF7; --ink:#1B2630; --muted:#5C6872; --line:#D8D4CA; --focus:#1B2630; --flash:#F6E7A8;
  --work:#1F7A45; --work-bg:#DCEBE1;
  --off:#3F6794;  --off-bg:#E0E8F0;
  --sick:#B3441C; --sick-bg:#F3DDD2;
  --pl:#6A4C9C;   --pl-bg:#E8E0F2;
  --ul:#7F6120;   --ul-bg:#F0E6CC;
  --ab:#A12641;   --ab-bg:#F4D9DF;
  --work-t:#1F7A45; --off-t:#3F6794; --sick-t:#B3441C; --pl-t:#6A4C9C; --ul-t:#7F6120; --ab-t:#A12641;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161B20; --surface:#1F262C; --ink:#E8E6E1; --muted:#9AA5AE; --line:#36404A; --focus:#E8E6E1; --flash:#5B5120;
    --work:#2E8653; --work-bg:#233A2C; --work-t:#86D6A3;
    --off:#4A74A3;  --off-bg:#222F3D;  --off-t:#9CBFE3;
    --sick:#C4552B; --sick-bg:#3E2B22; --sick-t:#F0A27E;
    --pl:#7E62B8;   --pl-bg:#2E2740;   --pl-t:#C3ADF0;
    --ul:#9A7A2C;   --ul-bg:#3A3220;   --ul-t:#E4C97F;
    --ab:#B53650;   --ab-bg:#40242B;   --ab-t:#F29AAE;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:0 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input[type=text],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:46px;padding:8px 12px;width:100%}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
[hidden]{display:none!important}

/* верхняя панель */
#top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line)}
.row1{display:flex;gap:8px;align-items:stretch}
.books{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.books button{border:0;border-radius:0;min-width:56px;font-weight:700;font-size:17px;background:transparent;color:var(--muted)}
.books button[aria-selected=true]{background:var(--ink);color:var(--bg)}
#dateBtn{flex:1;min-width:0;padding:0 6px;font-weight:600;font-size:clamp(13px,3.9vw,16px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dateBtn.past{background:#F3D98B;border-color:#C9A63A;color:#2A2100}
#menuBtn{width:48px;padding:0;font-size:22px}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 input{flex:1;min-width:0;font-size:18px}
#kb{width:54px;padding:0;font-weight:700}
#go{min-width:96px}
#scanBtn{width:54px;padding:0;font-size:22px}
/* сканер карточек */
body.scanning{overflow:hidden}
#scan{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#scan .schead{padding:10px 14px;display:flex;flex-direction:column;gap:2px}
#scan .schead span{font-size:13px;opacity:.8}
#scan .scview{position:relative;flex:1;min-height:0;overflow:hidden}
#scan video{width:100%;height:100%;object-fit:cover;display:block}
#scan .scframe{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#scan .scframe i{display:block;width:78%;height:20%;max-height:140px;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
#scan .scmsg{margin:0;padding:12px 14px;font-size:17px;font-weight:600;min-height:52px;background:#111}
#scan .scmsg.ok{background:#1b5e20}
#scan .scmsg.bad{background:#8e2a1c}
#scan .scacts{display:flex;gap:10px;padding:10px 14px 14px;background:#111}
#scan .scacts button{flex:1;min-height:52px;font-size:17px;font-weight:700}
#scan #scTorch.on{background:#ffd54f;color:#000}

main{max-width:760px;margin:0 auto;padding:0 10px}
.msg{min-height:0;margin:10px 0 0;padding:0;font-size:15px;border-radius:8px}
.msg:not(:empty){padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-left-width:6px}
.msg.ok{border-left-color:var(--work)} .msg.bad{border-left-color:var(--sick)} .msg.warn{border-left-color:var(--ul)}
.msg .u{float:right;min-height:34px;margin:-4px -6px 0 8px;padding:0 10px;font-weight:700}
.syncbar{display:block;width:100%;margin:10px 0 0;min-height:38px;padding:6px 12px;text-align:left;font-size:13px;color:var(--muted);border-left:6px solid var(--line);border-radius:8px}
.syncbar.ok{border-left-color:var(--work)} .syncbar.warn{border-left-color:var(--ul);color:var(--ink)} .syncbar.bad{border-left-color:var(--sick);color:var(--ink);font-weight:600}
textarea.link{min-height:96px;font-size:13px;word-break:break-all}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:12px 0 8px}
.stats div{display:flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;border-left:6px solid var(--line)}
.stats b{font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums;min-width:24px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stats div{display:block;border-left-width:1px;border-top:4px solid var(--line)}.stats b{display:block}}
.stats span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stats .w{border-left-color:var(--work);border-top-color:var(--work)} .stats .o{border-left-color:var(--off);border-top-color:var(--off)} .stats .s{border-left-color:var(--sick);border-top-color:var(--sick)} .stats .a{border-left-color:var(--ab);border-top-color:var(--ab)} .stats .a b{color:var(--ab-t)}
.stats2{font-size:13px;color:var(--muted);margin:0 2px 8px}
.tabs{display:flex;gap:6px;margin:0 0 10px}
.tabs button{flex:1;font-weight:600;font-size:clamp(13px,3.9vw,16px);padding:0 6px;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* список */
#list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{padding:12px 12px 12px 12px;border-bottom:1px solid var(--line);border-left:7px solid var(--line);background:var(--surface);scroll-margin-top:130px}
.row:last-child{border-bottom:0}
.row.s-work{border-left-color:var(--work)} .row.s-off{border-left-color:var(--off)} .row.s-sick{border-left-color:var(--sick)}
.row.s-pl{border-left-color:var(--pl)} .row.s-ul{border-left-color:var(--ul)} .row.s-ab{border-left-color:var(--ab)}
.row.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--flash)}to{background:var(--surface)}}
.who b{font-size:17px;font-weight:650;word-break:break-word}
.who b .tn{display:inline;font-size:15px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;margin-right:7px}
.who span{display:block;font-size:13px;color:var(--muted)}
.plan{font-size:13px;color:var(--muted);margin-top:2px}
.plan.po{color:var(--off-t);font-weight:600}
.head{display:flex;gap:8px;align-items:flex-start}
.head .who{flex:1;min-width:0}
.head .more{flex:none;width:44px;min-height:44px;padding:0;font-size:22px;line-height:1;color:var(--muted);margin:-6px -6px 0 0}
.btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.btns button{min-height:52px;font-weight:700;font-size:clamp(13px,3.6vw,15.5px);padding:0 2px;min-width:0;white-space:nowrap}
.btns button[aria-pressed=true],.extra button[aria-pressed=true]{color:#fff}
button.work[aria-pressed=true]{background:var(--work);border-color:var(--work)}
button.off[aria-pressed=true]{background:var(--off);border-color:var(--off)}
button.sick[aria-pressed=true]{background:var(--sick);border-color:var(--sick)}
button.pl[aria-pressed=true]{background:var(--pl);border-color:var(--pl)}
button.ul[aria-pressed=true]{background:var(--ul);border-color:var(--ul)}
button.ab[aria-pressed=true]{background:var(--ab);border-color:var(--ab)}
.extra{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.extra button{min-height:46px;font-weight:600;font-size:14px;white-space:normal;line-height:1.15;padding:4px 6px}
.hours{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.hours .step{width:48px;padding:0;font-size:24px;font-weight:600}
.hours .val{min-width:70px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.hours .chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.hours .chips button{min-width:44px;padding:0 8px;font-variant-numeric:tabular-nums}
.hours .chips button[aria-pressed=true]{background:var(--work-bg);border-color:var(--work);color:var(--work-t);font-weight:700}
.empty{padding:26px 16px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.empty p{margin:0 0 12px}
.empty .primary{margin:4px}

/* окна */
#sheetWrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet{position:relative;width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh h2{margin:0;font-size:19px}
.sh button{width:44px;padding:0;font-size:20px}
.list2{display:flex;flex-direction:column;gap:8px}
.list2 button{text-align:left;min-height:52px;font-weight:600;padding:8px 14px}
.list2 button small{display:block;font-weight:400;color:var(--muted)}
.fld{margin:0 0 12px} .fld label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px} .acts button{flex:1;min-width:120px}
.note{font-size:14px;color:var(--muted)}
.prow{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .t{flex:1;min-width:0} .prow .t b{display:block;font-weight:600} .prow .t span{font-size:13px;color:var(--muted)}
.prow button{min-height:40px}
.prow.arch{opacity:.65}
textarea.rep{min-height:200px;font-size:14px;line-height:1.45;white-space:pre}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;padding:0;font-size:22px} .stepper .val{min-width:70px;text-align:center;font-size:20px;font-weight:700}
#toast{position:fixed;left:50%;transform:translate(-50%,8px);bottom:calc(74px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:40;max-width:calc(100% - 28px);text-align:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
#toast.on{opacity:1;transform:translate(-50%,0)}
.banner{background:var(--sick-bg);border-left:6px solid var(--sick);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
/* нижняя панель: День / Месяц */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#tabbar button{flex:1;min-width:0;border:0;border-radius:0;min-height:54px;background:transparent;font-weight:700;font-size:clamp(12px,3.6vw,16px);padding:0 2px;color:var(--muted);border-top:3px solid transparent}
#tabbar button[aria-current=page]{color:var(--ink);border-top-color:var(--ink)}
body.kb #tabbar{display:none}
/* вкладка «Месяц» */
#month{display:none}
body.vmonth #month{display:block}
body.vmonth .row2,body.vmonth #dateBtn,body.vmonth #stats,body.vmonth #tabs,body.vmonth #list,body.vmonth #msg{display:none}
body.vmonth #menuBtn{margin-left:auto}
#docs{display:none}
body.vdocs #docs{display:block}
body.vdocs .row2,body.vdocs #stats,body.vdocs #tabs,body.vdocs #list,body.vdocs #msg{display:none}
#nd{display:none}
body.vnd #nd{display:block}
body.vnd .row2,body.vnd #dateBtn,body.vnd #stats,body.vnd #tabs,body.vnd #list,body.vnd #msg{display:none}
body.vnd #menuBtn{margin-left:auto}
.ndkinds button{min-height:44px;font-size:13px;line-height:1.15;padding:2px 4px}
.ndteamtools{display:flex;flex-direction:column;gap:6px;margin:0 0 8px}
.ndonly{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.ndonly input{width:20px;height:20px}
.ndgrp summary .ndcnt{font-weight:400;color:var(--muted);font-size:13px}
.ndcbs{display:flex;flex-direction:column;padding:4px 0}
.ndcb{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.ndcb input[type=checkbox]{width:20px;height:20px;flex:none;margin:1px 0 0}
.ndcb span{flex:1;min-width:0;display:flex;flex-direction:column}
.ndcb small{color:var(--muted);font-size:12px}
.ndcb.oth input[type=text]{flex:1 1 100%;margin-left:30px;width:calc(100% - 30px)}
.ndj{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.ndj:last-child{border-bottom:0}
.ndjt{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px}
.ndjt small{color:var(--muted);font-size:12px}
.ndjt .ndwarn{color:var(--sick-t)}
.ndon{font-size:12px;font-weight:700;color:var(--work-t,inherit)}
.ndjb{display:flex;flex-direction:column;gap:4px}
.ndjb button{min-height:34px;font-size:13px;padding:0 10px}
.dwrap{padding:4px 0 90px}
.dh2{font-size:20px;margin:12px 0 4px}
.dh3{font-size:16px;margin:14px 0 6px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dwrap textarea,.dwrap select,.dwrap input[type=text],.dwrap input[type=time],.dwrap input[type=date],.dwrap input[type=number],.dwrap input[type=search]{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.mlist{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow input{width:22px;height:22px;flex:none}
.mrow .mn{color:var(--muted);font-weight:700;min-width:44px}
.mrow .mf{flex:1;min-width:0;display:flex;flex-direction:column}
.mrow .mf small,.mrow .mh small{color:var(--muted);font-size:12px}
.mrow .mh{text-align:right;font-size:13px;display:flex;flex-direction:column}
.mrow:not(.on){opacity:.6}
.mobj{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 10px;background:var(--surface)}
.mobjh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.mobjh button{min-height:36px;font-size:14px}
.mtype{display:flex;gap:0;margin:12px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mtype button{flex:1;border:0;border-radius:0;min-height:44px;font-weight:700;background:var(--surface);color:var(--muted)}
.mtype button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.mhdr{margin:12px 0;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)}
.mhdr summary{font-weight:700;cursor:pointer;padding:4px 0}
.mnav{display:flex;gap:6px;align-items:center;margin:10px 0 6px}
.mnav button{width:46px;padding:0;font-size:18px;flex:none}
.mnav .mlabel{flex:1;text-align:center;font-size:18px;font-weight:700;min-width:0}
.mleg{font-size:12px;color:var(--muted);margin:0 2px 8px;line-height:1.35}
.mwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
table.mt{border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
.mt th,.mt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;min-width:36px;height:38px;padding:0;background:var(--surface)}
.mt thead th{position:sticky;top:0;z-index:2}
.mt th.c0{position:sticky;left:0;z-index:1;text-align:left;min-width:150px;max-width:150px;width:150px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mt th.c0 .tn{color:var(--muted);font-weight:600;margin-right:6px}
.mt thead th.c0{z-index:3}
.mt .tot{min-width:44px;font-weight:700;background:var(--bg)}
.mt .dh{border:0;background:none;border-radius:0;min-height:38px;width:100%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-weight:700;font-size:13px}
.mt .dh small{font-weight:400;color:var(--muted);font-size:10px}
.mt th.tdy .dh{box-shadow:inset 0 -3px 0 var(--ink)}
.mt td{cursor:pointer;font-weight:700}
.mt td.w{background:var(--work-bg);color:var(--work-t)} .mt td.o{background:var(--off-bg);color:var(--off-t)} .mt td.s{background:var(--sick-bg);color:var(--sick-t)}
.mt td.p{background:var(--pl-bg);color:var(--pl-t)} .mt td.u{background:var(--ul-bg);color:var(--ul-t)} .mt td.a{background:var(--ab-bg);color:var(--ab-t)}
.mt td.po{background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(239,108,0,.75) 5px 6px)}
.mt td.pm{background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(239,108,0,.35) 5px 6px)}
.mfull{display:none}
/* компьютер: табель за месяц на весь экран, весь месяц без прокрутки вбок */
@media (min-width:900px){
  body.vmonth main{max-width:none;padding:0 16px}
  body.vmonth .mfull{display:inline-flex;align-items:center;justify-content:center}
  body.vmonth .mwrap{overflow-x:hidden;overflow-y:auto}
  body.vmonth table.mt{width:100%;table-layout:fixed;font-size:12px}
  body.vmonth .mt th,body.vmonth .mt td{min-width:0;height:30px}
  body.vmonth .mt th.c0{width:clamp(170px,17vw,280px);min-width:0;max-width:none}
  body.vmonth .mt .tot{width:42px;min-width:0}
  body.vmonth .mt .dh{min-height:30px;font-size:12px}
  body.vmonth .mt .dh small{font-size:9px}
  body.vmonth .mt tfoot tr.f1 th,body.vmonth .mt tfoot tr.f1 td{bottom:30px}
}
.mt tfoot th,.mt tfoot td{position:sticky;background:var(--bg);font-weight:700;color:var(--muted);cursor:default}
.mt tfoot tr.f1 th,.mt tfoot tr.f1 td{bottom:38px;z-index:1}
.mt tfoot tr.f2 th,.mt tfoot tr.f2 td{bottom:0;z-index:1}

<input type="file" id="file" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';

var KEY='tabel-app-v1';
var APP_VER='25';   /* версия приложения: та же цифра лежит в version.txt на сайте */
var SEED=null;   /* __SEED__ */

/* ------------------------------------------------------------- справочники */
var BOOKS={rf:'РФ',are:'АРЕ'};
var STAT=[['work','Пришёл'],['off','Выходной'],['sick','Больничный'],['pl','Отпуск'],['ul','Отпуск без ЗП'],['ab','Прогул']];
var LBL={}; STAT.forEach(function(x){ LBL[x[0]]=x[1]; });
var CELL={off:'В',sick:'Б',pl:'ОТ',ul:'БС',ab:'ПР'};
var SCHEDS=[
  {id:'',name:'График не задан',short:''},
  {id:'std',name:'Обычный: вс–чт рабочие, выходные пт и сб',short:'Обычный график'},
  {id:'w61',name:'6/1 · выходной только пятница',short:'График 6/1'},
  {id:'g1',name:'№1 · 24/6, выходные 1–6 числа',short:'График №1',from:1,to:6},
  {id:'g2',name:'№2 · 24/6, выходные 7–12 числа',short:'График №2',from:7,to:12},
  {id:'g3',name:'№3 · 24/6, выходные 13–18 числа',short:'График №3',from:13,to:18},
  {id:'g4',name:'№4 · 24/6, выходные 19–24 числа',short:'График №4',from:19,to:24},
  {id:'g5',name:'№5 · 24/6, выходные 25–30 числа',short:'График №5',from:25,to:30}
];
var MONTHS_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONTHS_N=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var WD=['вс','пн','вт','ср','чт','пт','сб'];
var WD_FULL=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
var ST_OK={work:1,off:1,sick:1,pl:1,ul:1,ab:1};

/* ------------------------------------------------------------- мелочи */
function $(id){ return document.getElementById(id); }
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseYmd(s){ var a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function addDays(s,n){ var d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function today(){ return ymd(new Date()); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtH(h){ return String(h).replace('.',','); }
function clampH(h){ h=Number(h); return isFinite(h)?Math.min(24,Math.max(0,Math.round(h*2)/2)):8; }
function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function daysIn(m){ var a=m.split('-').map(Number); return new Date(a[0],a[1],0).getDate(); }
function schedById(id){ return SCHEDS.filter(function(x){ return x.id===id; })[0]; }
function validSched(v){ return schedById(v)?v:''; }
function normNum(n){ n=String(n).trim().replace(/^0+/,''); return n||'0'; }
var AR={}; for(var i=0;i<10;i++){ AR[String.fromCharCode(0x0660+i)]=String(i); AR[String.fromCharCode(0x06F0+i)]=String(i); }
function latinDigits(s){ return String(s).replace(/[\u0660-\u0669\u06F0-\u06F9]/g,function(c){ return AR[c]; }); }

function planOff(p,ds){
  if(!p.sched) return null;
  var d=parseYmd(ds);
  if(p.sched==='std'){ var w=d.getDay(); return w===5||w===6; }
  if(p.sched==='w61') return d.getDay()===5;
  var g=schedById(p.sched); if(!g||!g.from) return null;
  var n=d.getDate(); return n>=g.from&&n<=g.to;
}

/* ------------------------------------------------------------- данные */
function blank(){ return {people:[],records:{},object:'',defH:8}; }
function normalize(s){
  var b=blank();
  if(!s||typeof s!=='object') return b;
  if(Array.isArray(s.people)){
    var seen={};
    s.people.forEach(function(p){
      if(p&&typeof p.id==='string'&&typeof p.name==='string'&&p.name.trim()&&p.id!=='__proto__'&&!seen[p.id]){
        seen[p.id]=1;
        b.people.push({id:p.id,name:p.name.trim().slice(0,120),role:typeof p.role==='string'?p.role.slice(0,120):'',
          num:typeof p.num==='string'?p.num.slice(0,20):(typeof p.num==='number'?String(p.num):''),sched:validSched(p.sched),archived:!!p.archived,added:Number(p.added)>0?Number(p.added):0,upd:Number(p.upd)>0?Number(p.upd):0});
      }
    });
  }
  if(s.records&&typeof s.records==='object'){
    Object.keys(s.records).forEach(function(d){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      var day=s.records[d]; if(!day||typeof day!=='object') return;
      var out={}, any=false;
      Object.keys(day).forEach(function(id){
        if(id==='__proto__') return;
        var r=day[id];
        if(r&&ST_OK[r.s]===1){ out[id]={s:r.s,h:r.s==='work'?clampH(r.h):0,t:Number(r.t)>0?Number(r.t):0}; any=true; }
      });
      if(any) b.records[d]=out;
    });
  }
  if(typeof s.object==='string') b.object=s.object.slice(0,80);
  var dh=Number(s.defH); if(dh>0&&dh<=24) b.defH=Math.round(dh*2)/2;
  return b;
}
function blankRoot(){ return {v:2,cur:'rf',books:{rf:blank(),are:blank()}}; }
function normalizeRoot(raw){
  var r=blankRoot();
  if(raw&&raw.books&&typeof raw.books==='object'){
    r.books.rf=normalize(raw.books.rf); r.books.are=normalize(raw.books.are);
    if(raw.cur==='are') r.cur='are';
  } else if(raw&&Array.isArray(raw.people)){ r.books.rf=normalize(raw); }
  return r;
}
var storageOK=true;
function load(){
  try{ var raw=localStorage.getItem(KEY); if(raw) return normalizeRoot(JSON.parse(raw)); }catch(e){}
  return blankRoot();
}
/* во всех списках — по возрастанию табельного номера; без номера — в конце, по алфавиту */
function numKey(n){ var d=String(n==null?'':n).replace(/\D/g,''); return d?Number(d):Infinity; }
function byNum(a,b){
  var x=numKey(a.num), y=numKey(b.num);
  if(x!==y) return x<y?-1:1;
  return String(a.name||'').localeCompare(String(b.name||''),'ru');
}
function sortPeople(r){ ['rf','are'].forEach(function(k){ if(r&&r.books&&r.books[k]&&Array.isArray(r.books[k].people)) r.books[k].people.sort(byNum); }); }
function save(){ sortPeople(root); try{ localStorage.setItem(KEY,JSON.stringify(root)); }catch(e){ storageOK=false; renderBanner(); } }
try{ localStorage.setItem(KEY+'-t','1'); localStorage.removeItem(KEY+'-t'); }catch(e){ storageOK=false; }

var root=load(); sortPeople(root);
function hasPeople(r){ return r.books.rf.people.length+r.books.are.people.length>0; }
if(SEED&&!hasPeople(root)){ root=normalizeRoot(SEED); save(); }
function bk(){ return root.books[root.cur]; }
function activePeople(){ return bk().people.filter(function(p){ return !p.archived; }); }
function person(id){ return bk().people.filter(function(p){ return p.id===id; })[0]; }
function dayRec(d){ return bk().records[d]||{}; }

var ui={date:today(),follow:true,filter:'all',q:'',open:{},undo:null,numMode:true,view:'day',month:today().slice(0,7)};

/* ------------------------------------------------------------- синхронизация с Google Таблицей */
var SYNC_KEY='tabel-app-sync-v1';
var URL_RE=/^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[\w-]+\/exec$/;
var LOCAL_RE=/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//;
function okUrl(u){ return URL_RE.test(u)||LOCAL_RE.test(u); }
function loadSync(){
  var d={url:'',code:'',who:'',queue:{},lastOk:0,rev:{},pq:[],aq:[]};
  try{
    var o=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');
    if(o&&typeof o==='object'){
      d.url=typeof o.url==='string'?o.url:''; d.code=typeof o.code==='string'?o.code:''; d.who=typeof o.who==='string'?o.who.slice(0,60):'';
      d.lastOk=Number(o.lastOk)||0; d.rosterAt=Number(o.rosterAt)||0; if(o.queue&&typeof o.queue==='object') d.queue=o.queue; if(o.rev&&typeof o.rev==='object') d.rev=o.rev; if(Array.isArray(o.aq)) d.aq=o.aq.filter(function(x){ return x&&(x.b==='rf'||x.b==='are')&&x.p&&x.p.n&&x.p.name; }); if(Array.isArray(o.pq)) d.pq=o.pq.filter(function(x){ return x&&(x.b==='rf'||x.b==='are')&&Array.isArray(x.nums)&&x.nums.length; });
    }
  }catch(e){}
  return d;
}
var sync=loadSync(), syncErr='', flushing=false, pulling=false, flushTimer=null;
function saveSync(){ try{ localStorage.setItem(SYNC_KEY,JSON.stringify(sync)); }catch(e){} }
function syncOn(){ return !!(sync.url&&sync.code&&okUrl(sync.url)); }
function qn(){ return Object.keys(sync.queue).length; }
function aqn(){ return (sync.aq||[]).length; }
function pqn(){ var n=0; (sync.pq||[]).forEach(function(x){ n+=x.nums.length; }); return n; }
function hhmm(ms){ var d=new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function b64u(str){ var a=new TextEncoder().encode(str), s=''; for(var i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); }
function unb64u(b){ var t=atob(b), a=new Uint8Array(t.length); for(var i=0;i<t.length;i++) a[i]=t.charCodeAt(i); return new TextDecoder().decode(a); }

function call(payload){
  payload.code=sync.code; payload.app=APP_VER; if(!payload.who) payload.who=sync.who;
  var ctl=window.AbortController?new AbortController():null, to=setTimeout(function(){ if(ctl) ctl.abort(); },25000);
  return fetch(sync.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow',cache:'no-store',signal:ctl?ctl.signal:undefined})
    .then(function(r){ return r.json(); })
    .then(function(j){ clearTimeout(to); if(!j||j.ok!==true) throw new Error((j&&j.error)||'bad_response'); return j; },function(e){ clearTimeout(to); throw e; });
}
function syncFail(e){
  var m=e&&e.message;
  if(m==='bad_code'||m==='code_not_set') syncErr=m;
  else if(m==='bad_action') syncErr='old';
  else if((e&&(e.name==='TypeError'||e.name==='AbortError'))||navigator.onLine===false) syncErr='net';
  else syncErr='other';
  if(syncErr!=='bad_code'&&syncErr!=='code_not_set'&&navigator.onLine!==false) checkApi();   // вдруг адрес таблицы сменился
}
function statusText(){
  var n=qn();
  if(syncErr==='bad_code') return ['bad','⚠ Неверный секретный код. Нажмите, чтобы исправить.'];
  if(syncErr==='code_not_set') return ['bad','⚠ В таблице не задан секретный код.'];
  if(syncErr==='old') return ['bad','⚠ Скрипт в таблице устарел: удаление людей не работает. Сообщите администратору.'];
  var pn=pqn();
  if(pn&&!syncErr&&navigator.onLine!==false) return ['warn','⏳ Удаляю в таблице: '+pn+' чел.'];
  if(aqn()&&!syncErr&&navigator.onLine!==false) return ['warn','⏳ Отправляю в таблицу новых людей: '+aqn()];
  if(syncErr==='net'||navigator.onLine===false) return ['warn','⚠ Нет связи. Отметки сохранены на телефоне'+(n?' ('+n+' ждут отправки)':'')+(pqn()||aqn()?'. Изменения в списке людей отправлю позже':'')+'.'];
  if(syncErr) return ['warn','⚠ Таблица не отвечает'+(n?' ('+n+' ждут отправки)':'')+'. Попробую снова.'];
  if(n) return ['warn','⏳ Отправляю отметки: '+n];
  return ['ok','✓ Таблица подключена'+(sync.lastOk?', обновлено '+hhmm(sync.lastOk):'')];
}
function renderSyncBar(){
  var el=$('syncbar'); if(!el) return;
  if(!syncOn()){ el.hidden=true; return; }
  var st=statusText(); el.hidden=false; el.className='syncbar '+st[0]; el.textContent=st[1];
}
/* после изменения отметки: запомнить в очереди и отправить, как только можно */
function track(bookId,date,pid){
  if(!syncOn()) return;
  var b=root.books[bookId], p=b.people.filter(function(x){ return x.id===pid; })[0];
  if(!p||!p.num) return;
  var r=(b.records[date]||{})[pid];
  sync.queue[bookId+'|'+date+'|'+p.num]={b:bookId,d:date,n:p.num,s:r?r.s:'',h:r?r.h:0,t:r&&r.t?r.t:Date.now(),a:p.added||0};
  saveSync(); renderSyncBar(); scheduleFlush(700);
}
function scheduleFlush(ms){ clearTimeout(flushTimer); flushTimer=setTimeout(flush,ms||700); }
function flush(){
  if(!syncOn()||flushing) return;
  ndFlush();
  if(sync.pq&&sync.pq.length) return flushPurge();
  if(sync.aq&&sync.aq.length) return flushAdd();
  if(Date.now()-(Number(sync.rosterAt)||0)>6*3600000) return flushRoster();
  var keys=Object.keys(sync.queue); if(!keys.length) return;
  if(navigator.onLine===false){ syncErr='net'; renderSyncBar(); return; }
  flushing=true;
  var batch=keys.slice(0,200).map(function(k){ return sync.queue[k]; });
  call({action:'push',who:sync.who,items:batch}).then(function(j){
    applyServer(j);
    batch.forEach(function(it){ var k=it.b+'|'+it.d+'|'+it.n; if(sync.queue[k]&&sync.queue[k].t===it.t) delete sync.queue[k]; });
    sync.lastOk=Date.now(); syncErr=''; saveSync(); flushing=false; renderSyncBar();
    if(qn()) scheduleFlush(200); else pull();
  }).catch(function(e){
    flushing=false; syncFail(e); renderSyncBar();
    if(syncErr!=='bad_code'&&syncErr!=='code_not_set') scheduleFlush(20000);
  });
}
/* удаления навсегда: отправляются в таблицу раньше отметок; при обрыве связи ждут в очереди */
function flushPurge(){
  if(!syncOn()||flushing||!sync.pq.length) return;
  if(navigator.onLine===false){ syncErr='net'; renderSyncBar(); return; }
  flushing=true;
  var job=sync.pq[0];
  call({action:'purge',book:job.b,nums:job.nums,names:job.names||{},who:sync.who}).then(function(j){
    sync.pq.shift(); sync.lastOk=Date.now(); syncErr=''; saveSync(); flushing=false;
    applyServer(j); renderSyncBar();
    toast('Удалено и в таблице ('+job.nums.length+' чел.). На других телефонах удалится при синхронизации');
    scheduleFlush(200);
  }).catch(function(e){
    flushing=false; syncFail(e); renderSyncBar();
    if(syncErr!=='bad_code'&&syncErr!=='code_not_set') scheduleFlush(syncErr==='old'?120000:20000);
  });
}
/* добавленные и изменённые люди: уходят в таблицу, а через неё — на все телефоны */
function queueAdd(bookId,p){
  if(!syncOn()||!p||!p.num||!p.name) return false;
  sync.aq=sync.aq||[];
  sync.aq=sync.aq.filter(function(x){ return !(x.b===bookId&&normNum(x.p.n)===normNum(p.num)); });
  sync.aq.push({b:bookId,p:{n:p.num,name:p.name,role:p.role||'',sched:p.sched||''}});
  saveSync(); renderSyncBar(); scheduleFlush(500); return true;
}
function flushAdd(){
  if(!syncOn()||flushing||!sync.aq.length) return;
  if(navigator.onLine===false){ syncErr='net'; renderSyncBar(); return; }
  flushing=true;
  var b=sync.aq[0].b, batch=sync.aq.filter(function(x){ return x.b===b; }).slice(0,100);
  call({action:'addp',book:b,people:batch.map(function(x){ return x.p; })}).then(function(j){
    sync.aq=sync.aq.filter(function(x){ return batch.indexOf(x)<0; });
    sync.lastOk=Date.now(); syncErr=''; saveSync(); flushing=false;
    applyServer(j); renderSyncBar();
    scheduleFlush(200);
  }).catch(function(e){
    flushing=false; syncFail(e); renderSyncBar();
    if(syncErr!=='bad_code'&&syncErr!=='code_not_set') scheduleFlush(syncErr==='old'?120000:20000);
  });
}
/* сверка списков: раз в 6 часов телефон отправляет в таблицу всех своих людей;
   кого нет в общем списке, таблица добавит и разошлёт на все телефоны */
var rosterBook=null;
function flushRoster(){
  if(!syncOn()||flushing) return;
  if(navigator.onLine===false){ syncErr='net'; renderSyncBar(); return; }
  flushing=true;
  var b=rosterBook==='rf'?'are':'rf';
  var list=root.books[b].people.filter(function(p){ return p.num&&p.name&&!p.archived; })
    .map(function(p){ return {n:p.num,name:p.name,role:p.role||'',sched:p.sched||'',a:p.added||0}; });
  call({action:'roster',book:b,people:list}).then(function(j){
    flushing=false; rosterBook=b; syncErr=''; sync.lastOk=Date.now();
    if(b==='are'){ sync.rosterAt=Date.now(); rosterBook=null; }
    saveSync(); applyServer(j); renderSyncBar(); scheduleFlush(200);
  }).catch(function(e){
    flushing=false; syncFail(e); renderSyncBar();
    if(e&&e.message==='bad_action'){ sync.rosterAt=Date.now(); saveSync(); syncErr=''; scheduleFlush(200); return; }
    if(syncErr!=='bad_code'&&syncErr!=='code_not_set') scheduleFlush(20000);
  });
}
/* люди, добавленные или изменённые на других телефонах (список приходит из таблицы с каждым ответом) */
function applyAdded(a){
  if(!a||typeof a!=='object') return;
  var added=[], cur=false, edited=false;
  ['rf','are'].forEach(function(b){
    var list=a[b]; if(!Array.isArray(list)||!list.length) return;
    var bb=root.books[b], byNum={}, skip={};
    bb.people.forEach(function(p){ if(p.num) byNum[normNum(p.num)]=p; });
    (sync.pq||[]).forEach(function(x){ if(x.b===b) x.nums.forEach(function(n){ skip[normNum(n)]=1; }); });   // удаляем — не возвращать
    (sync.aq||[]).forEach(function(x){ if(x.b===b) skip[normNum(x.p.n)]=1; });                            // своё изменение ещё не отправлено
    list.forEach(function(x){
      if(!Array.isArray(x)||!x[0]||!x[1]) return;
      var k=normNum(x[0]), t=Number(x[4])||0; if(skip[k]) return;
      var p=byNum[k];
      if(!p){
        p={id:uid(),name:String(x[1]).slice(0,120),role:String(x[2]||'').slice(0,120),num:String(x[0]).slice(0,20),sched:validSched(x[3]),archived:false,added:t,upd:t};
        bb.people.push(p); byNum[k]=p; added.push(p.name); if(b===root.cur) cur=true;
      } else if(t>1&&t>(p.upd||0)){   // t=1 — запись из сверки: только добавляет, чужие правки не трогает
        var ch=p.name!==x[1]||p.role!==(x[2]||'')||p.sched!==validSched(x[3]);

/* стёртые в таблице периоды: удалить у себя отметки за эти дни, сделанные до стирания */
function applyClears(list){
  if(!Array.isArray(list)||!list.length) return;
  var n=0, cur=false, re=/^\d{4}-\d{2}-\d{2}$/;
  list.forEach(function(c){
    if(!c||!re.test(c.from)||!re.test(c.to)) return;
    var t=Number(c.t)||0;
    ['rf','are'].forEach(function(b){
      if(c.b!=='*'&&c.b!==b) return;
      var recs=root.books[b].records;
      Object.keys(recs).forEach(function(d){
        if(d<c.from||d>c.to) return;
        var day=recs[d];
        Object.keys(day).forEach(function(id){ if((Number(day[id].t)||0)<=t){ delete day[id]; n++; if(b===root.cur) cur=true; } });
        if(!Object.keys(day).length) delete recs[d];
      });
      Object.keys(sync.queue).forEach(function(k){ var it=sync.queue[k]; if(it&&it.b===b&&it.d>=c.from&&it.d<=c.to&&(Number(it.t)||0)<=t) delete sync.queue[k]; });
    });
  });
  if(!n) return;
  save(); saveSync(); renderSyncBar(); if(cur) render();
  toast('Удалены отметки за стёртый в таблице период: '+n);
}
/* список удалённых навсегда (приходит из таблицы с каждым ответом): удалить этих людей и на этом телефоне.
   Человека, добавленного на телефоне уже после удаления, не трогаем. */
function applyGone(g){
  if(!g||typeof g!=='object') return;
  var names=[], cur=false;
  ['rf','are'].forEach(function(b){
    var list=g[b]; if(!Array.isArray(list)||!list.length) return;
    var gt={};
    list.forEach(function(x){ if(Array.isArray(x)&&x[0]!=null){ var k=normNum(x[0]); gt[k]=Math.max(gt[k]||0,Number(x[1])||0); } });
    var ids=[];
    root.books[b].people.forEach(function(p){
      if(!p.num) return; var t=gt[normNum(p.num)];
      if(t&&(p.added||0)<t){ ids.push(p.id); names.push(p.name); }
    });
    if(ids.length){ deletePeopleIn(b,ids); if(b===root.cur) cur=true; }
  });
  if(!names.length) return;
  if(editId&&!person(editId)){ editId=null; closeSheet(); }
  if(cur) render();
  toast('Удалены навсегда (в таблице): '+(names.length>3?names.length+' чел.':names.join(', ')));
}
/* забрать отметки за открытый день; побеждает более поздняя запись */
function mergePull(b,d0,items){
  var bb=root.books[b], byNum={}, changed=false;
  bb.people.forEach(function(p){ if(p.num&&!p.archived) byNum[normNum(p.num)]=p; });
  items.forEach(function(it){
    var p=byNum[normNum(it.n)]; if(!p) return;
    var d=/^\d{4}-\d{2}-\d{2}$/.test(it.d||'')?it.d:d0;
    var t=Number(it.t)||0, q=sync.queue[b+'|'+d+'|'+p.num];
    if(q&&q.t>=t) return;
    var day=bb.records[d], loc=day&&day[p.id];
    if(loc&&loc.t>=t) return;
    if(it.s===''){ if(loc){ delete day[p.id]; if(!Object.keys(day).length) delete bb.records[d]; changed=true; } return; }
    if(ST_OK[it.s]!==1) return;
    if(!bb.records[d]) bb.records[d]={};
    bb.records[d][p.id]={s:it.s,h:it.s==='work'?clampH(it.h):0,t:t}; changed=true;
  });
  if(changed) save();

}

  var toks=text.split(/[\s,;]+/).filter(Boolean).map(function(x){ return x.replace(/^[№#]/,''); });
  var allNum=toks.length&&toks.every(function(x){ return /^\d+$/.test(x); });
  var ppl=activePeople();
  if(!allNum){
    var found=ppl.filter(function(p){ return matches(p,text); });
    if(found.length===1){ markPresent([found[0]],[],text); return; }
    showMsg(found.length?'Найдено: '+found.length+'. Нажмите «Пришёл» у нужного человека в списке или введите табельный номер.':'Никого не найдено.',found.length?'warn':'bad');
    return;
  }
  var by={}; ppl.forEach(function(p){ if(p.num) (by[normNum(p.num)]=by[normNum(p.num)]||[]).push(p); });
  var seen={}, hit=[], unknown=[], dup=[];
  toks.forEach(function(t){
    var k=normNum(t); if(seen[k]) return; seen[k]=1;
    var m=by[k];
    if(!m) unknown.push(t); else if(m.length>1) dup.push(t); else hit.push(m[0]);
  });
  markPresent(hit,unknown,text,dup);
}
function markPresent(hit,unknown,text,dup){
  var day=dayObj(ui.date,true), changes=[], done=[], same=[], conflict=[];
  hit.forEach(function(p){
    var cur=day[p.id];
    if(cur&&cur.s==='work'){ same.push(p); return; }
    if(cur){ conflict.push([p,cur]); return; }
    day[p.id]={s:'work',h:bk().defH,t:Date.now()}; changes.push([p.id,null]); done.push(p);
  });
  dropEmpty(ui.date); save(); done.forEach(function(p){ track(root.cur,ui.date,p.id); });
  var lines=[], one=hit.length===1&&!unknown.length&&!(dup&&dup.length);
  if(one&&done.length){ lines.push('✅ <b>'+esc(done[0].num)+' '+esc(done[0].name)+'</b> — пришёл, '+fmtH(bk().defH)+' ч'); }
  else if(done.length){ lines.push('✅ Отмечено: <b>'+done.length+'</b>'); }
  same.forEach(function(p){ lines.push('• '+esc(p.num)+' '+esc(p.name)+' — уже отмечен как «Пришёл»'); });
  conflict.forEach(function(c){ lines.push('⚠ '+esc(c[0].num)+' '+esc(c[0].name)+' — уже отмечен: '+LBL[c[1].s]+'. Не менял, исправьте в списке.'); });
  (dup||[]).forEach(function(t){ lines.push('⚠ Номер '+esc(t)+' у нескольких человек. Отметьте в списке.'); });
  if(unknown.length===1) lines.push('❌ '+esc(unknown[0])+' — работника с таким табельным номером нет в списке.');
  else if(unknown.length) lines.push('❌ Работника с таким табельным номером нет в списке: '+esc(unknown.slice(0,20).join(', '))+(unknown.length>20?' и ещё '+(unknown.length-20):''));
  var kind=unknown.length||conflict.length||(dup&&dup.length)?(done.length?'warn':'bad'):'ok';
  if(!done.length&&!unknown.length&&!conflict.length&&!(dup&&dup.length)) kind='ok';
  showMsg(lines.join('<br>'),kind,changes.length?{date:ui.date,book:root.cur,changes:changes}:null);
  if(done.length||same.length||conflict.length){ $('q').value=''; ui.q=''; }
  render();
  if(one){ var li=document.querySelector('#list li[data-id="'+(window.CSS&&CSS.escape?CSS.escape(hit[0].id):hit[0].id)+'"]'); if(li){ li.scrollIntoView({block:'center'}); li.classList.add('flash'); } }
  $('q').focus({preventScroll:true});
}
function undo(){
  var u=ui.undo; if(!u) return;
  var b=root.books[u.book], day=b.records[u.date]||(b.records[u.date]={});
  u.changes.forEach(function(c){ if(c[1]===null) delete day[c[0]]; else day[c[0]]={s:c[1].s,h:c[1].h,t:Date.now()}; });
  if(!Object.keys(day).length) delete b.records[u.date];
  save(); u.changes.forEach(function(c){ track(u.book,u.date,c[0]); }); clearMsg(); render(); toast('Отменено');
}

function cellText(r){ return !r?'':r.s==='work'?fmtH(r.h):CELL[r.s]; }
function monthCsv(month){
  var n=daysIn(month), rows=[], head=['Таб. №','ФИО','Должность'];
  for(var i=1;i<=n;i++) head.push(String(i));
  head.push('Дней','Часов'); rows.push(head);

  bk().people.filter(function(p){
    if(!p.archived) return true;
    return Object.keys(recs).some(function(d){ return d.indexOf(month+'-')===0&&recs[d][p.id]; });
  }).forEach(function(p){

      var r=(recs[month+'-'+pad(i)]||{})[p.id];
      row.push(cellText(r));

function shareText(text){
  if(navigator.share){
    return navigator.share({text:text}).then(function(){ return 'shared'; },function(e){ return e&&e.name==='AbortError'?'cancel':copy(text); });
  }
  return Promise.resolve(copy(text));
}
function copy(text){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(function(){ return 'copied'; },function(){ return legacyCopy(text); });
  }catch(e){}
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(t){
  try{ var a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); var ok=document.execCommand('copy'); a.remove(); return ok?'copied':'fail'; }catch(e){ return 'fail'; }

function viaClaude(name,content){
  try{
    if(window.claude&&window.claude.use){
      return window.claude.use('downloads').then(function(c){
        if(!c) return null;
        return c.save({filename:name,data:content}).then(function(){ return 'download'; },function(e){ return e&&e.code==='declined'?'cancel':null; });
      },function(){ return null; });
    }
  }catch(e){}
  return Promise.resolve(null);
}
function saveFile(name,mime,content){
  return viaClaude(name,content).then(function(r){ return r||saveFile2(name,mime,content); });
}
function saveFile2(name,mime,content){
  var file; try{ file=new File([content],name,{type:mime}); }catch(e){ file=null; }
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    return navigator.share({files:[file],title:name}).then(function(){ return 'shared'; },function(e){ return e&&e.name==='AbortError'?'cancel':download(name,mime,content); });
  }
  return Promise.resolve(download(name,mime,content));
}
function download(name,mime,content){
  try{
    var url=URL.createObjectURL(new Blob([content],{type:mime}));
    var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },3000);
    return 'download';
  }catch(e){ return 'fail'; }
}

  var b=root.books[bookId], set={}, marks=0; ids.forEach(function(i){ set[i]=1; });

  b.people.forEach(function(p){ if(p.num) delete gone[p.num]; });          // номер ещё есть у другого человека
  Object.keys(b.records).forEach(function(d){
    var day=b.records[d];
    Object.keys(day).forEach(function(id){ if(set[id]){ delete day[id]; marks++; } });
    if(!Object.keys(day).length) delete b.records[d];
  });

/* Зашифрованный список с сайта (файл people.enc): на сайте имён нет, пароль знают только свои */
function b64d(str){ var t=atob(str), a=new Uint8Array(t.length); for(var i=0;i<t.length;i++) a[i]=t.charCodeAt(i); return a; }
function decryptPack(pack,pass){
  if(!window.crypto||!crypto.subtle) return Promise.reject(new Error('nocrypto'));
  if(!pack||pack.v!==1||pack.kdf!=='PBKDF2-SHA256'||!(pack.iter>=100000&&pack.iter<=2000000)) return Promise.reject(new Error('format'));
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pass.normalize('NFC')),'PBKDF2',false,['deriveKey'])
    .then(function(k){ return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(pack.salt),iterations:pack.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']); })
    .then(function(key){ return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(pack.iv)},key,b64d(pack.data)); })
    .then(function(buf){ return new TextDecoder().decode(buf); });
}
function sheetPassword(){
  openSheet('Список с сайта','<p class="note">Список людей лежит на сайте в зашифрованном виде. Введите пароль, который вам дал администратор.</p>'+

        e&&e.name==='OperationError'?'Неверный пароль.':

    });
}
function doImport(mode){

/* ------------------------------------------------------------- сканер карточек: камера читает табельный номер */
var SCAN_LIB='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
var scan={on:false,stream:null,worker:null,loading:null,busy:false,timer:null,last:'',lastN:0,cool:{},torch:false,count:0};
function loadScript(src){
  return new Promise(function(ok,bad){ var s=document.createElement('script'); s.src=src; s.async=true; s.onload=ok; s.onerror=function(){ bad(new Error('nolib')); }; document.head.appendChild(s); });
}
function scanEngine(){
  if(scan.worker) return Promise.resolve(scan.worker);
  if(scan.loading) return scan.loading;
  scan.loading=(window.Tesseract?Promise.resolve():loadScript(SCAN_LIB))
    .then(function(){ return Tesseract.createWorker('eng',1); })
    .then(function(w){ return w.setParameters({tessedit_char_whitelist:'0123456789',tessedit_pageseg_mode:'7'}).then(function(){ scan.worker=w; return w; }); })
    .catch(function(e){ scan.loading=null; throw e; });
  return scan.loading;
}
function scanMsg(t,kind){ var e=$('scMsg'); if(e){ e.textContent=t; e.className='scmsg'+(kind?' '+kind:''); } }
function openScan(){
  if(ui.view!=='day') setView('day');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast('Камера недоступна в этом браузере'); return; }

  var w=document.createElement('div'); w.id='scan'; w.setAttribute('role','dialog'); w.setAttribute('aria-label','Сканер карточек');
  w.innerHTML='<div class="schead"><b>Сканер карточек · '+BOOKS[root.cur]+'</b><span>Отметка «Пришёл» '+fmtH(bk().defH)+' ч за '+d.getDate()+' '+MONTHS_G[d.getMonth()]+(ui.date===today()?' (сегодня)':' ⚠ не сегодня')+'</span></div>'+
    '<div class="scview"><video id="scVid" playsinline muted autoplay></video><div class="scframe"><i></i></div></div>'+
    '<p id="scMsg" class="scmsg">Включаю камеру…</p>'+
    '<div class="scacts"><button data-a="sctorch" id="scTorch" hidden>Фонарик</button><button class="primary" data-a="scclose">Готово<span id="scCnt"></span></button></div>';
  document.body.appendChild(w); document.body.classList.add('scanning');
  scan.on=true; scan.last=''; scan.lastN=0; scan.count=0; scan.cool={};
  navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}})
    .then(function(st){
      if(!scan.on){ st.getTracks().forEach(function(t){ t.stop(); }); return; }
      scan.stream=st; var v=$('scVid'); v.srcObject=st; v.play().catch(function(){});
      var tr=st.getVideoTracks()[0], caps=tr&&tr.getCapabilities?tr.getCapabilities():{};
      if(caps.torch) $('scTorch').hidden=false;
      if(caps.focusMode&&caps.focusMode.indexOf('continuous')>=0) tr.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(function(){});
      scanMsg('Загружаю распознавание цифр…');
      return scanEngine().then(function(){ if(scan.on){ scanMsg('Наведите камеру на номер карточки, чтобы он был в рамке'); scanLoop(); } });
    })
    .catch(function(e){
      var m=e&&e.message==='nolib'?'Не удалось загрузить распознавание: нужен интернет при первом запуске.':
        e&&(e.name==='NotAllowedError'||e.name==='SecurityError')?'Нет доступа к камере. Разрешите камеру для этого сайта в настройках браузера.':
        e&&e.name==='NotFoundError'?'Камера не найдена.':'Не удалось включить камеру или распознавание.';

    });
}
function closeScan(){
  scan.on=false; clearTimeout(scan.timer);
  if(scan.stream){ scan.stream.getTracks().forEach(function(t){ t.stop(); }); scan.stream=null; }

function toggleTorch(){

  scan.torch=!scan.torch; tr.applyConstraints({advanced:[{torch:scan.torch}]}).catch(function(){});
  $('scTorch').classList.toggle('on',scan.torch);

/* вырезать из кадра полосу внутри рамки, сделать чёрно-белой и контрастной */
function scanFrame(){
  var v=$('scVid'); if(!v||!v.videoWidth) return null;
  var vw=v.videoWidth, vh=v.videoHeight, box=v.getBoundingClientRect(), fr=document.querySelector('#scan .scframe i').getBoundingClientRect();
  var k=Math.max(box.width/vw,box.height/vh), ox=(box.width-vw*k)/2, oy=(box.height-vh*k)/2;   // видео растянуто как object-fit:cover
  var sx=Math.max(0,(fr.left-box.left-ox)/k), sy=Math.max(0,(fr.top-box.top-oy)/k), sw=Math.min(vw-sx,fr.width/k), sh=Math.min(vh-sy,fr.height/k);
  if(sw<10||sh<10) return null;
  var scale=Math.min(2,Math.max(1,120/sh)), c=document.createElement('canvas'); c.width=Math.round(sw*scale); c.height=Math.round(sh*scale);
  var x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
  var im=x.getImageData(0,0,c.width,c.height), p=im.data, mn=255, mx=0, i, g;
  for(i=0;i<p.length;i+=4){ g=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000; p[i]=g; if(g<mn) mn=g; if(g>mx) mx=g; }
  var rg=Math.max(1,mx-mn);
  for(i=0;i<p.length;i+=4){ g=(p[i]-mn)*255/rg; p[i]=p[i+1]=p[i+2]=g; }
  x.putImageData(im,0,0); return c;
}
function scanLoop(){
  if(!scan.on) return;
  if(scan.busy||!scan.worker){ scan.timer=setTimeout(scanLoop,300); return; }
  var c=scanFrame(); if(!c){ scan.timer=setTimeout(scanLoop,300); return; }
  scan.busy=true;
  scan.worker.recognize(c).then(function(r){
    scan.busy=false; if(!scan.on) return;
    var all=latinDigits(r&&r.data&&r.data.text||'').match(/\d+/g)||[];
    var toks=all.filter(function(x){ return x.length>=4&&x.length<=5; });
    var hit=null;
    toks.forEach(function(t){ if(!hit&&findByNum(root.cur,t)) hit=t; });
    // к номеру могли прилипнуть лишние цифры (например, от надписи «Таб. №») — ищем внутри известный номер
    all.forEach(function(x){
      if(hit||x.length<=5) return;
      for(var L=5;L>=4&&!hit;L--) for(var i=0;i+L<=x.length&&!hit;i++){ var sub=x.substr(i,L); if(findByNum(root.cur,sub)) hit=sub; }
    });
    var n=hit||toks[0]||'';
    if(n&&n===scan.last) scan.lastN++; else { scan.last=n; scan.lastN=n?1:0; }
    if(n&&scan.lastN>=2) onScanned(n);   // одно и то же число прочитано два раза подряд — не ошибка распознавания
    scan.timer=setTimeout(scanLoop,150);
  }).catch(function(){ scan.busy=false; scan.timer=setTimeout(scanLoop,600); });
}
function findByNum(bookId,n){
  var k=normNum(n); return root.books[bookId].people.filter(function(p){ return p.num&&!p.archived&&normNum(p.num)===k; })[0]||null;
}
function scanBeep(ok){
  try{ if(navigator.vibrate) navigator.vibrate(ok?80:[60,60,60]); }catch(e){}
  try{
    var A=window.AudioContext||window.webkitAudioContext; if(!A) return;
    scan.ac=scan.ac||new A(); var o=scan.ac.createOscillator(), g=scan.ac.createGain();
    o.frequency.value=ok?1320:330; g.gain.value=0.08; o.connect(g); g.connect(scan.ac.destination); o.start(); o.stop(scan.ac.currentTime+(ok?0.12:0.25));
  }catch(e){}
}
function onScanned(n){
  var k=normNum(n), now=Date.now();
  if(scan.cool[k]&&now-scan.cool[k]<5000) return;   // эту карточку только что отметили
  scan.cool[k]=now; scan.last=''; scan.lastN=0;
  var p=findByNum(root.cur,n);
  if(!p){
    var other=findByNum(root.cur==='rf'?'are':'rf',n);
    scanBeep(false);
    scanMsg('№ '+n+' — нет в табеле '+BOOKS[root.cur]+(other?' (он в табеле '+BOOKS[root.cur==='rf'?'are':'rf']+')':''),'bad');
    return;
  }
  var day=dayObj(ui.date,true), cur=day[p.id];
  if(cur&&cur.s==='work'){ scanBeep(true); scanMsg('✓ '+p.num+' '+p.name+' — уже отмечен: пришёл, '+fmtH(cur.h)+' ч','ok'); return; }
  day[p.id]={s:'work',h:bk().defH,t:now};
  save(); track(root.cur,ui.date,p.id);
  scan.count++; $('scCnt').textContent=' ('+scan.count+')';
  scanBeep(true);
  scanMsg('✓ '+p.num+' '+p.name+' — пришёл, '+fmtH(bk().defH)+' ч'+(cur?' (было: '+(LBL[cur.s]||cur.s)+')':''),'ok');
}

var MEMO_KEY='tabel-memo-v1', MEMO_DEPT='участка общестроительных работ №2';

/* время по каждому человеку: если в табеле часов больше нормы — сверхурочные часы из табеля, иначе общее «с» */
function memoTimes(x,c){
  if(memoType()==='rvd'){
    var f=tmin(c.rfrom), e=tmin(c.rto), bf=tmin(c.rbf), bt=tmin(c.rbt), br=isFinite(bf)&&isFinite(bt)&&bt>bf?bt-bf:0;
    return {from:tstr(f),to:tstr(e),bf:br?tstr(bf):'-',bt:br?tstr(bt):'-',h:Math.max(0,(e-f-br)/60)};
  }
  var to=tmin(c.to), n=memoNorm(root.cur), from=x.h>n?to-Math.round((x.h-n)*60):tmin(c.from);
  return {from:tstr(from),to:tstr(to),bf:'-',bt:'-',h:Math.max(0,(to-from)/60)};
}

/* ---- сборка .docx: шаблон с сайта + простой zip без сжатия */
var memoTpl={};
function memoTemplate(t){
  if(memoTpl[t]) return Promise.resolve(memoTpl[t]);
  return fetch(t==='rvd'?'memo-rvd.json':'memo-template.json',{cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error('notpl'); return r.json(); }).then(function(j){ memoTpl[t]=j; return j; });
}
function xesc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var CRC_T=(function(){ var t=[],c,n,k; for(n=0;n<256;n++){ c=n; for(k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ var c=0xFFFFFFFF; for(var i=0;i<b.length;i++) c=CRC_T[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){
  var enc=new TextEncoder(), parts=[], central=[], off=0, now=new Date();
  var dt=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xFFFF, dd=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;
  function hdr(size){ return new DataView(new ArrayBuffer(size)); }
  Object.keys(files).forEach(function(name){
    var nb=enc.encode(name), data=files[name] instanceof Uint8Array?files[name]:enc.encode(files[name]), crc=crc32(data);
    var h=hdr(30); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,dt,true); h.setUint16(12,dd,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true);
    h.setUint16(26,nb.length,true); h.setUint16(28,0,true);
    parts.push(h.buffer,nb,data);
    var c=hdr(46); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,dt,true); c.setUint16(14,dd,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true);
    c.setUint16(28,nb.length,true); c.setUint16(30,0,true); c.setUint16(32,0,true); c.setUint16(34,0,true); c.setUint16(36,0,true); c.setUint32(38,0,true); c.setUint32(42,off,true);
    central.push(c.buffer,nb);
    off+=30+nb.length+data.length;
  });
  var csize=central.reduce(function(s,x){ return s+(x.byteLength); },0);
  var e=hdr(22); e.setUint32(0,0x06054b50,true); e.setUint16(8,Object.keys(files).length,true); e.setUint16(10,Object.keys(files).length,true);
  e.setUint32(12,csize,true); e.setUint32(16,off,true);
  return new Blob(parts.concat(central,[e.buffer]),{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
function memoBuild(tpl,data){
  var doc=tpl.files['word/document.xml'];
  var rows=data.people.map(function(x){
    return tpl.row.replace('{{TN}}',xesc(x.num)).replace('{{FIO}}',xesc(x.name)).replace('{{ROLE}}',xesc(x.role)).replace('{{DATE}}',xesc(data.date))
      .replace('{{FROM}}',x.from).replace('{{TO}}',x.to).replace('{{BF}}',x.bf||'-').replace('{{BT}}',x.bt||'-').replace('{{H}}',xesc(fmtH(x.h)));
  }).join('');
  var works=data.objs.map(function(o){
    return (o.obj?tpl.pobj.replace('{{TEXT}}',xesc(o.obj)):'')+
      o.works.split(/\r?\n/).filter(function(l){ return l.trim(); }).map(function(l){ return tpl.pline.replace('{{TEXT}}',xesc(l.trim())); }).join('');
  }).join('');
  var hd=data.hdr||{};
  ['addr','fromName','s1','s2','s3','s4'].forEach(function(k){ var ph={addr:'{{ADDR}}',fromName:'{{FROMNAME}}',s1:'{{S1}}',s2:'{{S2}}',s3:'{{S3}}',s4:'{{S4}}'}[k]; doc=doc.split(ph).join(xesc(hd[k]||'')); });
  doc=doc.replace('<!--ROWS-->',function(){ return rows; }).replace('<!--WORKS-->',function(){ return works; }).replace('{{RESP}}',function(){ return xesc(data.resp); });
  var files={}; Object.keys(tpl.files).forEach(function(k){ files[k]=tpl.files[k]; }); files['word/document.xml']=doc;
  return zipStore(files);
}
function memoMake(){
  var c=memoCfg(), msg=$('m_msg'), list=memoPeople().filter(memoChecked);
  if(!list.length){ msg.textContent='Отметьте хотя бы одного работника.'; return; }
  var objs=c.objs.map(function(o){ return {obj:o.obj.trim(),works:o.works}; }).filter(function(o){ return o.obj||o.works.trim(); });
  if(!objs.length||objs.some(function(o){ return !o.works.trim(); })){ msg.textContent='Заполните виды работ и объёмы у каждого объекта.'; return; }
  if(objs.some(function(o){ return !o.obj; })){ msg.textContent='Укажите название у каждого объекта.'; return; }
  if(!c.resp.trim()){ msg.textContent='Укажите ответственного.'; $('m_resp').focus(); return; }
  var mt=memoType(), hdr=memoHdr(), miss=MEMO_HDR_F.filter(function(f){ return MEMO_NEED[mt].indexOf(f[0])>=0&&!String(hdr[f[0]]||'').trim(); });
  if(miss.length){ msg.textContent='Заполните «Шапка и подписи»: '+miss.map(function(f){ return f[1]; }).join(', ')+'.'; var dd=document.querySelector('.mhdr'); if(dd) dd.open=true; return; }
  var a=ui.date.split('-'), date=a[2]+'.'+a[1]+'.'+a[0];
  var people=list.map(function(x){ var t=memoTimes(x,c); return {num:x.p.num||'',name:x.p.name,role:x.p.role||'',from:t.from,to:t.to,bf:t.bf,bt:t.bt,h:t.h}; });
  if(people.some(function(x){ return !(x.h>0); })){ msg.textContent='Проверьте время: у кого-то получилось 0 часов.'; return; }
  msg.textContent='Готовлю файл…';
  memoTemplate(mt).then(function(tpl){
    var blob=memoBuild(tpl,{hdr:hdr,date:date,people:people,objs:objs,resp:c.resp.trim()});
    var name=(mt==='rvd'?'РВД_':'Сверхурочная_работа_')+a[2]+'_'+a[1]+'_'+a[0].slice(2)+(root.cur==='are'?'_АРЕ':'')+'.docx';
    return saveFile(name,blob.type,blob).then(function(r){ if($('m_msg')) $('m_msg').textContent=r==='cancel'?'':'Готово: '+name+' ('+people.length+' чел.)'; reportDone(r); });
  }).catch(function(){ if($('m_msg')) $('m_msg').textContent='Не удалось загрузить образец записки. Нужен интернет при первом запуске.'; });
}

function ndDates(st,k){

/* самообновление: телефон сам переходит на новую версию с сайта, даже если приложение не закрывали */
var updChecking=false;
function checkUpdate(){
  if(updChecking||!/^https?:$/.test(location.protocol)||navigator.onLine===false) return;
  updChecking=true;
  fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.text():''; }).then(function(v){
    updChecking=false; v=String(v||'').trim();
    if(!/^\d+$/.test(v)||Number(v)<=Number(APP_VER)) return;
    if(!$('sheetWrap').hidden||flushing||document.activeElement===$('q')){ setTimeout(checkUpdate,30000); return; }
    try{ if(sessionStorage.getItem('tabel-upd-tried')===v) return; sessionStorage.setItem('tabel-upd-tried',v); sessionStorage.setItem('tabel-upd',v); }catch(e){ return; }   // не больше одной попытки на версию: без зацикливания
    location.reload();
  }).catch(function(){ updChecking=false; });
}
try{ if(sessionStorage.getItem('tabel-upd')){ sessionStorage.removeItem('tabel-upd'); setTimeout(function(){ toast('Приложение обновлено до версии '+APP_VER); },600); } }catch(e){}
setTimeout(checkUpdate,3000);
/* основной адрес таблицы (веб-приложения Apps Script) лежит на сайте в api.json.
   Если он сменился, телефон проверяет новый адрес своим секретным кодом и переходит на него сам. */
var apiChecking=false, apiLast=0;
function checkApi(force){
  if(apiChecking||!sync.code||!/^https?:$/.test(location.protocol)||navigator.onLine===false) return;
  if(!force&&Date.now()-apiLast<60000) return;
  apiChecking=true; apiLast=Date.now();
  fetch('api.json?t='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.json():null; }).then(function(o){
    var u=o&&typeof o.url==='string'?o.url.trim():'';
    if(!okUrl(u)||u===sync.url){ apiChecking=false; return; }
    return fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({code:sync.code,action:'ping',who:sync.who,app:APP_VER}),redirect:'follow',cache:'no-store'})
      .then(function(r){ return r.json(); }).then(function(j){
        apiChecking=false;
        if(!j||j.ok!==true) return;
        sync.url=u; sync.rev={}; saveSync(); syncErr=''; renderSyncBar();
        toast('Адрес таблицы обновлён автоматически'); syncNow();
      });
  }).catch(function(){ apiChecking=false; });
}
setTimeout(function(){ checkApi(true); },2000);
setInterval(function(){ if(!document.hidden) checkApi(); },5*60000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) checkApi(); });
setInterval(function(){ if(!document.hidden) checkUpdate(); },5*60000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) checkUpdate(); });
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
